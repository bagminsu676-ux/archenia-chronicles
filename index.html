 sword:{name:'검의 길',stat:'sword',stages:[['목검을 든 아이','첫 목검 수련','마당의 낡은 목검을 처음 쥐었습니다. 스승은 힘보다 자세를 먼저 익히라 일렀습니다.',['기본 자세를 반복한다',{sword:2,honor:1},'손바닥에 물집이 잡혔지만 흔들리지 않는 자세를 익혔습니다.'],['또래와 겨룬다',{sword:1,relation:1},'작은 승부는 경쟁보다 함께 성장하는 즐거움을 남겼습니다.'],['검의 역사를 읽는다',{knowledge:2,sword:1},'오래된 검객들의 기록에서 힘을 쓰는 이유를 배웠습니다.']],['검술 견습생','기사단의 문','기사단의 문 앞에서 검술과 맹세를 시험받습니다.',['정공법으로 시험을 치른다',{sword:3,honor:1},'정확한 발놀림과 절제된 검끝이 심사관의 눈에 들었습니다.'],['동료를 지키며 겨룬다',{sword:1,relation:2},'승패보다 동료를 살핀 선택이 기사단에 오래 기억되었습니다.'],['전술로 약점을 파고든다',{strategy:2,sword:1},'상대의 빈틈을 읽어 시험을 통과했습니다.'] ],['기사','첫 국경 임무','국경 초소의 첫 임무. 실제 전장은 훈련장과 달랐습니다.',['전열을 지킨다',{sword:2,honor:2,health:-1},'흔들리는 전열을 버텨 민간인의 대피 시간을 벌었습니다.'],['정찰병과 함께 움직인다',{strategy:2,health:1},'불필요한 충돌을 피하고 매복 위치를 알아냈습니다.'],['부상자를 후송한다',{relation:2,faith:1},'검을 거두고 부상자들을 안전한 곳까지 옮겼습니다.'] ],['기사단장','깃발 아래의 지휘','여러 부대가 당신의 명령을 기다립니다. 제한된 병력으로 성문을 지켜야 합니다.',['성문을 끝까지 지킨다',{sword:2,honor:2,health:-2},'성문은 무너지지 않았고 병사들은 당신의 판단을 따랐습니다.'],['퇴로를 열고 주민을 피신시킨다',{strategy:2,relation:2},'영토 일부를 내주고 더 많은 생명을 구했습니다.'],['증원군을 설득해 연합한다',{eloquence:2,honor:1},'서로 다투던 부대가 한 깃발 아래 모였습니다.'] ],['왕의 검','왕실의 마지막 결투','왕을 겨눈 결투 신청이 들어왔습니다. 승리보다 왕국의 질서를 지킬 방법을 택해야 합니다.',['결투를 받아 명예를 세운다',{sword:3,honor:2},'결투는 짧게 끝났고 왕실은 당신에게 검의 권한을 맡겼습니다.'],['재판과 증언을 요구한다',{eloquence:2,knowledge:2},'증거를 공개해 칼 없이 음모를 드러냈습니다.'],['상대에게 물러날 길을 준다',{relation:2,honor:1},'상대는 무기를 내려놓았고 피할 수 있었던 전투를 멈췄습니다.'] ],['검술 스승','마지막 제자','오래된 수련장에서 마지막 제자를 받아들일지 묻습니다.',['가문의 비전을 전한다',{sword:2,knowledge:2},'검의 비결을 기록과 훈련으로 나누어 다음 세대에 남겼습니다.'],['누구나 배울 수 있게 연다',{honor:2,relation:2},'출신과 가문을 따지지 않는 검술 교실이 열렸습니다.'],['검을 내려놓고 평화를 택한다',{happiness:2,faith:1},'당신은 전투보다 평온한 날들의 가치를 가르쳤습니다.'] ] ]},
 magic:{name:'마법의 길',stat:'magic',stages:[['마력에 눈뜬 아이','첫 마력의 불꽃','손끝에서 작은 빛이 피어납니다. 놀란 가족이 마탑의 견습관을 부릅니다.',['빛을 안정시킨다',{magic:2,knowledge:1},'흔들리던 불꽃이 작은 별처럼 손바닥 위에 머물렀습니다.'],['마력의 흐름을 기록한다',{knowledge:2,mana:1},'빛의 움직임을 적어 첫 연구 기록을 남겼습니다.'],['가족에게 빛을 나눈다',{relation:2,magic:1},'불안해하던 가족은 손을 맞잡고 빛을 바라보았습니다.'] ],['마탑 견습생','마탑의 입문식','마탑은 실력과 절제를 함께 시험합니다. 견습생은 첫 학파를 선택해야 합니다.',['원소 마법을 택한다',{magic:3,mana:1},'불꽃과 바람을 다루는 수련실에 이름을 올렸습니다.'],['룬과 기록을 택한다',{knowledge:2,magic:1},'오래된 룬의 구조를 해독하는 연구를 맡았습니다.'],['치유 마법을 택한다',{faith:2,magic:1},'마력으로 상처를 봉합하는 의원들의 수련에 합류했습니다.'] ],['마법사','봉인된 유물 조사','마탑 지하의 유물이 밤마다 다른 목소리를 냅니다. 기록관은 조사를 맡깁니다.',['봉인을 유지하며 조사한다',{knowledge:2,magic:2},'봉인은 유지되었고 유물의 기원을 설명할 단서를 찾았습니다.'],['마력을 직접 흘려보낸다',{magic:3,mana:-2},'위험을 감수한 실험으로 유물의 반응을 확인했습니다.'],['주민을 먼저 대피시킨다',{honor:2,relation:1},'실험을 멈추고 주변 사람들을 안전하게 옮겼습니다.'] ],['대마법사','균열의 봉인','대륙의 하늘에 생긴 균열이 커집니다. 서로 다른 학파의 힘을 모아야 합니다.',['자신의 마력을 핵으로 삼는다',{magic:3,health:-2,mana:-3},'당신의 마력이 균열을 꿰매듯 닫았습니다.'],['학파 간 공동 의식을 제안한다',{eloquence:2,magic:1,relation:1},'마탑과 신전은 각자의 힘을 보태 균열을 봉인했습니다.'],['고대 기록에서 해법을 찾는다',{knowledge:3,magic:1},'잊힌 주문의 빈 구절을 복원해 재앙을 막았습니다.'] ],['대마도사','금기 연구의 심판','금기 연구의 결과를 공개할지, 봉인할지, 책임질지 마탑이 답을 요구합니다.',['위험과 결과를 공개한다',{knowledge:2,honor:2},'마탑은 기록을 봉인하지 않고 연구 윤리의 기준으로 남겼습니다.'],['연구를 봉인하고 피해자를 돕는다',{faith:2,relation:2},'금기를 멈추고 실험의 피해를 입은 이들을 돌보았습니다.'],['책임을 지고 추방을 감수한다',{magic:2,honor:1},'마탑을 떠났지만 연구의 책임을 피하지 않았습니다.'] ],['마탑 원로','마지막 강의','후계자들이 마지막 강의를 청합니다. 어떤 지식을 미래에 남기겠습니까?',['모든 주문을 기록한다',{knowledge:3,magic:1},'당신의 필사본은 다음 세대의 마법사들에게 길잡이가 되었습니다.'],['제자에게 판단을 맡긴다',{relation:2,honor:2},'제자들은 서로 다른 답을 찾을 자유를 얻었습니다.'],['마력을 세계수에 돌려준다',{faith:2,magic:1},'세계수의 뿌리는 당신의 마력을 받아 오래된 숲을 되살렸습니다.'] ] ]},
 faith:{name:'신앙의 길',stat:'faith',stages:[['신전의 아이','첫 기도','새벽 종소리에 잠에서 깨어 신전의 작은 제단 앞에 섭니다.',['이웃을 위해 기도한다',{faith:2,relation:1},'기도는 이웃을 돌보는 손길로 이어졌습니다.'],['경전의 한 구절을 배운다',{faith:1,knowledge:2},'짧은 구절의 뜻을 이해하려 하루를 보냈습니다.'],['상처 입은 이를 돕는다',{faith:1,health:1,relation:1},'기도보다 먼저 내민 손이 누군가의 고통을 덜었습니다.'] ],['신전 시종','신학교의 서약','신학교는 교리 암송과 사람을 대하는 태도를 함께 살핍니다.',['의례를 정확히 익힌다',{faith:3,honor:1},'정돈된 의식은 공동체에 평온을 주었습니다.'],['병자 곁에서 실습한다',{faith:1,relation:2},'신앙은 아픈 이 곁을 지키는 일에서 배어났습니다.'],['서로 다른 교리를 공부한다',{knowledge:2,faith:1},'다른 믿음을 듣고도 흔들리지 않는 질문을 배웠습니다.'] ],['사제','기적을 둘러싼 논쟁','마을에서 일어난 회복을 기적으로 선포할지 신중히 확인할지 결정해야 합니다.',['증언을 모아 사실을 살핀다',{knowledge:2,faith:1},'사실과 믿음을 함께 존중하는 기록이 남았습니다.'],['신도들의 희망을 지킨다',{faith:2,happiness:1},'사람들은 서로를 돌보며 회복의 시간을 견뎠습니다.'],['치유와 구휼을 시작한다',{faith:2,relation:2},'신전은 논쟁 대신 필요한 이들에게 약과 음식을 나눴습니다.'] ],['주교','기근 속 구휼','흉작으로 식량이 모자랍니다. 신전의 창고와 귀족의 곡물을 어떻게 나눌지 정해야 합니다.',['창고를 열어 모두에게 나눈다',{faith:2,honor:2,gold:-8},'곡물은 빠르게 줄었지만 마을의 겨울을 함께 넘겼습니다.'],['귀족을 설득해 공동 구휼을 연다',{eloquence:2,relation:2},'귀족과 신전이 함께 곡물을 대어 더 많은 이를 구했습니다.'],['다음 수확을 위한 씨앗을 남긴다',{strategy:2,knowledge:1},'지금의 배급은 줄었지만 이듬해 파종할 씨앗을 지켰습니다.'] ],['대주교','신앙 재판','권력자들이 이단 재판을 서두릅니다. 무고한 이를 지키면서 진실도 밝혀야 합니다.',['독립된 증언을 모은다',{knowledge:2,honor:2},'서로 다른 증언이 맞물리며 조작의 흔적이 드러났습니다.'],['재판을 공개하고 피고를 변호한다',{eloquence:2,faith:1},'공개 절차는 군중의 분노를 낮추고 공정한 판단을 이끌었습니다.'],['처벌 대신 화해의 조건을 찾는다',{relation:2,faith:1},'가해자와 피해자가 받아들일 수 있는 회복의 길을 마련했습니다.'] ],['성인','마지막 축복','세상을 떠나기 전 마지막 축복을 청하는 이들이 신전 앞에 모였습니다.',['모두의 이름을 불러 축복한다',{faith:2,relation:2},'사람들은 각자의 이름을 들으며 서로의 곁을 지켰습니다.'],['새 세대에게 판단을 맡긴다',{honor:2,knowledge:1},'당신은 신앙이 한 사람의 권력으로 굳지 않도록 자리를 내주었습니다.'],['조용히 기도하며 함께한다',{happiness:2,faith:1},'말없는 기도 속에서 긴 생의 감사와 슬픔을 나누었습니다.'] ] ]},
 merchant:{name:'상인의 길',stat:'eloquence',stages:[['장터의 아이','첫 장사','작은 물건 몇 개를 맡아 장터에서 팔 기회를 얻었습니다.',['값을 정하고 직접 판다',{eloquence:2,gold:3},'흥정 끝에 첫 이익을 남겼고 손님은 다시 오겠다고 약속했습니다.'],['품질을 살펴 적정가를 부른다',{knowledge:1,eloquence:1,gold:2},'정직한 설명에 손님은 값을 받아들였습니다.'],['남은 물건을 이웃과 나눈다',{relation:2,honor:1},'큰 이익은 없었지만 이웃 상인과 신뢰를 쌓았습니다.'] ],['길드 견습','길드 장부 시험','길드의 견습 자리는 장부와 신용을 함께 확인한 뒤 주어집니다.',['장부를 정확히 맞춘다',{knowledge:2,eloquence:1},'한 푼의 오차도 없는 장부로 길드의 신뢰를 얻었습니다.'],['상인들과 거래를 조정한다',{eloquence:2,relation:1},'서로 다른 조건을 조정해 거래를 성사시켰습니다.'],['위험을 계산해 작은 투자한다',{strategy:2,gold:4},'조심스러운 투자로 첫 자본을 불렸습니다.'] ],['상인','대륙 간 첫 거래','먼 대륙의 상단이 낯선 조건으로 교역을 제안합니다.',['품질과 운송을 직접 확인한다',{knowledge:2,gold:5},'운송 경로를 검증해 손실을 줄이고 거래를 성사시켰습니다.'],['위험을 나누는 계약을 쓴다',{eloquence:2,strategy:1,gold:3},'위험을 나눈 계약은 양측의 신뢰를 만들었습니다.'],['현지 주민과 이익을 나눈다',{relation:2,honor:1,gold:2},'지역 상인도 수익에 참여해 새 무역로를 환영했습니다.'] ],['길드 간부','길드장 선출','길드가 세금과 독점권을 놓고 분열됩니다. 조합을 이끌 선택이 필요합니다.',['소상인의 발언권을 보장한다',{honor:2,relation:2},'작은 상점들도 길드 회의에 참여하는 규약이 마련됐습니다.'],['수익 구조를 재정비한다',{strategy:2,gold:8},'낭비를 줄이고 길드의 재정 기반을 튼튼히 했습니다.'],['경쟁 길드와 휴전을 맺는다',{eloquence:2,relation:1},'가격 전쟁을 멈추고 두 길드는 운송로를 함께 관리했습니다.'] ],['대상단주','왕실 차관의 제안','왕실은 전쟁 자금을 맡기려 합니다. 상업의 이익과 시민의 부담을 저울질해야 합니다.',['투명한 조건으로 자금을 빌려준다',{eloquence:2,honor:2,gold:10},'상환 장부를 공개한 계약으로 왕실과 시민의 신뢰를 얻었습니다.'],['전쟁 대신 기반 시설을 제안한다',{strategy:2,knowledge:1},'왕실은 항구와 도로를 보수하는 데 차관을 사용했습니다.'],['시민 부담이 커지는 계약은 거절한다',{honor:2,relation:1},'예상 이익은 놓쳤지만 무리한 세금 인상을 막았습니다.'] ],['상인의 원로','장부를 물려줄 날','후계자들은 서로 다른 방식의 장사를 주장합니다. 당신의 장부를 어떻게 남기겠습니까?',['상단의 지분을 나누어 준다',{relation:2,honor:1,gold:8},'여러 후계자가 각자의 거래망을 이어받았습니다.'],['실패한 거래까지 기록한다',{knowledge:3,eloquence:1},'실패의 원인도 장부에 남아 후대의 손실을 줄였습니다.'],['길드 학교를 세운다',{honor:2,knowledge:1,gold:-8},'가난한 견습생도 배울 수 있는 길드 학교가 문을 열었습니다.'] ] ]},
 commoner:{name:'평민의 길',stat:'strategy',stages:[['마을 아이','일터 견습','가까운 공방이나 농장에서 하루 일을 배워보라는 제안을 받았습니다.',['맡은 일을 끝까지 배운다',{strategy:1,knowledge:2},'작업 도구의 쓰임을 익히며 다음 일을 혼자 맡을 수 있게 됐습니다.'],['품삯을 정당하게 요구한다',{eloquence:2,honor:1},'작업량을 따져 합리적인 품삯을 약속받았습니다.'],['가족의 일을 돕는다',{relation:2,health:1},'가족은 함께 일하며 버틸 수 있는 작은 여유를 만들었습니다.'] ],['견습 일꾼','첫 품삯','첫 품삯을 받았습니다. 집안에 보탤지, 배움에 쓸지 스스로 정합니다.',['도구와 배움에 투자한다',{knowledge:2,strategy:1,gold:-3},'좋은 도구 덕에 작업이 빨라지고 맡을 수 있는 일이 늘었습니다.'],['집안의 빚을 먼저 갚는다',{honor:1,relation:2,gold:-3},'가족의 부담이 줄었고 집안의 신뢰가 깊어졌습니다.'],['저축해 독립 자금을 모은다',{strategy:2,gold:4},'작은 저축은 독립을 향한 첫 밑천이 되었습니다.'] ],['숙련 일꾼','독립의 집','견습을 마친 당신에게 자기 일터를 열 기회가 생겼습니다.',['작은 공방을 연다',{strategy:2,gold:-6},'동네의 주문을 꾸준히 맡는 작은 공방이 문을 열었습니다.'],['협동조합에 참여한다',{relation:2,honor:1},'노동자들은 함께 가격을 정하고 서로의 빈자리를 메웠습니다.'],['더 나은 도시로 떠난다',{knowledge:1,eloquence:1},'새 도시의 작업장은 낯설었지만 더 넓은 기술을 가르쳐 주었습니다.'] ],['마을 대표','흉작과 세금','흉작이 닥친 마을에 세금 징수관이 도착했습니다. 주민들은 당신에게 협상을 맡깁니다.',['세금 감면을 요구하며 장부를 내민다',{eloquence:2,honor:1},'수확량 기록을 근거로 세금 일부를 다음 해로 미뤘습니다.'],['공동 창고를 열어 배급한다',{relation:2,faith:1},'공동 창고는 겨울 동안 누구도 굶지 않도록 도왔습니다.'],['관개와 종자를 우선 확보한다',{strategy:2,knowledge:1,gold:-4},'지금의 소비를 줄여 다음 수확의 기반을 마련했습니다.'] ],['지역 유지','후손의 선택','자녀 세대는 고향에 남을지 도시로 떠날지 묻습니다.',['떠날 선택도 지지한다',{relation:2,happiness:1},'자녀들은 돌아올 곳이 있다는 걸 알고 새로운 길을 택했습니다.'],['마을의 학교를 맡긴다',{honor:2,knowledge:1},'학교는 가문 밖의 아이들에게도 배움의 문을 열었습니다.'],['공동 토지를 지킨다',{strategy:2,relation:1},'토지는 한 집안의 재산이 아니라 마을의 안전망으로 남았습니다.'] ],['마을의 어른','평온한 저녁','마을 사람들이 오래된 우물가에 모여 당신의 이야기를 청합니다.',['일과 이웃의 이야기를 들려준다',{eloquence:1,relation:2},'평범한 하루를 지켜낸 이야기가 아이들의 마음에 남았습니다.'],['공동체 기록을 남긴다',{knowledge:2,honor:1},'마을의 이름과 기억은 기록관의 책장에 보관되었습니다.'],['조용한 시간을 가족과 보낸다',{happiness:2,relation:1},'당신은 가장 가까운 사람들과 평온한 저녁을 나눴습니다.'] ] ]},
 slave:{name:'해방의 길',stat:'strategy',stages:[['묶인 아이','첫 일과 첫 약속','주어진 일을 마치면 쉬는 시간을 얻습니다. 믿을 사람과 위험을 나눌지 결정해야 합니다.',['함께 일하는 아이를 돕는다',{relation:2,health:1},'서로의 몫을 나누어 맡으며 작지만 든든한 동료가 생겼습니다.'],['글과 숫자를 몰래 배운다',{knowledge:2,strategy:1},'장부를 읽을 만큼의 글과 셈을 익혔습니다.'],['주인의 신뢰를 얻어 시간을 번다',{eloquence:1,strategy:1},'성실한 모습을 보이며 더 많은 이동과 배움의 시간을 얻었습니다.'] ],['견습 노역자','탈출의 단서','감시가 느슨해지는 밤, 바깥으로 이어질 단서를 발견했습니다.',['다른 이들과 함께 탈출을 준비한다',{strategy:2,relation:2,health:-1},'서로 맡은 역할을 정해 탈출 경로와 피난처를 마련했습니다.'],['법률 기록을 모은다',{knowledge:2,honor:1},'계약의 위법성을 보여주는 기록을 확보했습니다.'],['신전의 보호를 요청한다',{faith:2,relation:1},'신전은 당신과 동료들에게 임시 보호처를 내주었습니다.'] ],['자유를 찾는 이','해방의 증언','재판관 앞에서 자유를 얻을 근거를 말해야 합니다. 증언하는 이들에게도 위험이 따릅니다.',['동료들의 증언을 모은다',{eloquence:2,honor:2},'서로의 증언은 강제 계약의 거짓을 밝혔습니다.'],['대피와 안전을 우선한다',{strategy:2,relation:1},'재판이 늦어져도 동료들을 안전한 곳으로 옮겼습니다.'],['위험을 감수하고 계약을 공개한다',{knowledge:2,honor:1,health:-1},'계약서의 조작 흔적을 공개해 후속 조사의 문을 열었습니다.'] ],['해방 운동가','봉기의 밤','영주의 군대가 마을로 다가옵니다. 저항과 협상 중 어느 길도 희생을 부를 수 있습니다.',['주민의 대피로를 먼저 연다',{strategy:2,relation:2},'피난로가 열려 아이들과 노약자들이 위험 지역을 벗어났습니다.'],['무기를 나누어 저항한다',{sword:2,honor:1,health:-2},'저항은 희생을 낳았지만 영주의 군대는 무고한 주민을 해치지 못했습니다.'],['해방 조건을 두고 협상한다',{eloquence:2,faith:1},'영주와 중재자는 강제 노역을 끝낼 조건을 문서로 남겼습니다.'] ],['해방의 지도자','권리의 약속','해방된 이들의 권리를 왕국의 법으로 보장할 기회가 왔습니다.',['법과 토지 권리를 요구한다',{honor:2,eloquence:1},'해방민은 자유와 함께 땅을 소유할 권리를 얻었습니다.'],['피해자 배상과 회복을 요구한다',{relation:2,knowledge:1},'피해를 기록하고 회복 비용을 공동으로 마련했습니다.'],['다른 지역의 해방을 돕는다',{faith:2,honor:1},'당신의 조직은 국경 너머 강제 노역자에게도 손을 뻗었습니다.'] ],['자유의 원로','돌아온 봄','오랜 투쟁 끝에 다시 봄이 왔습니다. 자유를 얻지 못한 이들에게 무엇을 남길까요?',['해방 기금을 다음 세대에 맡긴다',{honor:2,relation:1,gold:-5},'기금은 탈출과 재판을 준비하는 이들의 안전망이 되었습니다.'],['증언과 이름을 기록한다',{knowledge:2,honor:2},'희생된 이들의 이름은 기록에서 지워지지 않게 되었습니다.'],['평화로운 삶을 먼저 돌본다',{happiness:2,faith:1},'당신은 싸움만으로 생을 채우지 않아도 된다는 사실을 몸소 보여주었습니다.'] ] ]}
};

defineEvent('memoir',[40,59],'회고록 집필','성장','왕국의 역사가 당신의 생애를 기록하고 싶어 합니다. 어떤 진실을 후대에 남길지 결정해야 합니다.',[defineChoice('성공과 영광을 기록한다',{honor:2,happiness:1},"“성공과 영광을 기록한다”를 선택했습니다. 사람들은 이후 당신을 대하는 태도를 조금 바꾸었습니다."),defineChoice('실패와 과오도 숨김없이 쓴다',{knowledge:2,faith:1},"“실패와 과오도 숨김없이 쓴다”를 선택했습니다. 그날 얻은 단서는 훗날 다시 꺼내 볼 기억으로 남았습니다."),defineChoice('가족과 동료의 이야기를 남긴다',{relation:2,eloquence:1},"“가족과 동료의 이야기를 남긴다”를 선택했습니다. 그 마음을 받은 이는 훗날에도 당신을 먼저 떠올렸습니다.")],()=>true,{extraChoices:c=>c.familyMemory?.length?[defineChoice('가문에 전해진 오래된 기억을 기록한다',{knowledge:1,eloquence:1},'가족의 이야기가 회고록에 실려 후대의 판단을 바꾸었습니다.','family-memory-memoir')]:[]}),
defineEvent('old-friend-dies',[40,59],'옛 친구의 죽음','가족','오랜 벗이 세상을 떠났다는 소식이 도착했습니다. 마지막 편지에는 함께하지 못한 날들에 대한 말이 남았습니다.',[defineChoice('장례를 직접 치른다',{relation:3,faith:1},"“장례를 직접 치른다”를 선택했습니다. 두 사람 사이에 작은 신뢰의 시작이 놓였습니다."),defineChoice('친구의 뜻을 이어받는다',{honor:2,happiness:1},"“친구의 뜻을 이어받는다”를 선택했습니다. 당신의 이름은 그 자리에 있던 이들의 입에 오르내렸습니다."),defineChoice('슬픔을 글로 남긴다',{knowledge:1,eloquence:2},"“슬픔을 글로 남긴다”를 선택했습니다. 그 대답은 듣는 이의 태도를 바꾸어 놓았습니다.")]),
defineEvent('king-final-request',[40,59],'왕의 마지막 부탁','정치','왕이 병상에서 당신을 부릅니다. 마지막 부탁은 왕국의 운명을 바꿀 수 있는 비밀과 연결되어 있습니다.',[defineChoice('왕의 뜻을 받아들인다',{honor:2,relation:2},"“왕의 뜻을 받아들인다”를 선택했습니다. 사람들은 이후 당신을 대하는 태도를 조금 바꾸었습니다."),defineChoice('후계자에게 진실을 알린다',{knowledge:2,eloquence:1},"“후계자에게 진실을 알린다”를 선택했습니다. 그날 얻은 단서는 훗날 다시 꺼내 볼 기억으로 남았습니다."),defineChoice('왕국의 안정부터 지킨다',{strategy:2,happiness:1},"“왕국의 안정부터 지킨다”를 선택했습니다. 당신의 판단은 주변의 다음 대응을 바꾸었습니다.")]),
defineEvent('grandchild-talk',[60,90],'손자와의 대화','가족','손자가 당신의 지난 생을 묻습니다. 작은 질문 하나가 오래 접어 두었던 기억을 열어줍니다.',[defineChoice('가장 소중했던 사람을 이야기한다',{happiness:2,relation:2},"“가장 소중했던 사람을 이야기한다”를 선택했습니다. 작은 기쁨이 집안의 긴장을 누그러뜨렸습니다."),defineChoice('실패에서 배운 것을 들려준다',{knowledge:2,faith:1},"“실패에서 배운 것을 들려준다”를 선택했습니다. 그날 얻은 단서는 훗날 다시 꺼내 볼 기억으로 남았습니다."),defineChoice('아직 남은 모험을 약속한다',{eloquence:1,happiness:2},"“아직 남은 모험을 약속한다”를 선택했습니다. 그 순간의 온기는 가까운 이들의 기억에 오래 남았습니다.")]),
defineEvent('last-testament',[60,90],'마지막 유언','가족','가문과 친구들이 마지막 뜻을 기다립니다. 재산보다 오래 남을 말을 고를 수 있습니다.',[defineChoice('가문의 책임을 나눈다',{honor:2,relation:2},"“가문의 책임을 나눈다”를 선택했습니다. 사람들은 이후 당신을 대하는 태도를 조금 바꾸었습니다."),defineChoice('화해하지 못한 이에게 편지를 쓴다',{happiness:2,eloquence:2},"“화해하지 못한 이에게 편지를 쓴다”를 선택했습니다. 주변의 얼굴에 안도와 기쁨이 번졌습니다."),defineChoice('모두에게 자유를 남긴다',{faith:2,relation:2},"“모두에게 자유를 남긴다”를 선택했습니다. 신전의 사람들은 그날의 마음가짐을 기억했습니다.")]),
defineEvent('last-breath',[60,90],'황혼의 회고','가족','저녁 햇살이 창가에 내려앉습니다. 긴 생의 장면들이 하나씩 떠오르고, 곁에는 당신의 이야기를 물려받을 이들이 모여 있습니다.',[defineChoice('가문의 영광을 이야기한다',{honor:2,relation:1},"가문의 영광을 나누자 후손들은 당신이 지켜온 약속과 삶의 지혜를 오래 기억하기로 했습니다."),defineChoice('사랑했던 이의 이름을 부른다',{happiness:3,relation:2},"사랑했던 이들과 함께한 기억을 나누며 가족 사이에 따뜻한 유대가 깊어졌습니다."),defineChoice('신에게 기도를 올린다',{faith:2,knowledge:1},"기도 끝에 얻은 평온을 나누었습니다. 신전 사람들은 당신의 이야기를 연대기에 기록했습니다.")]),
defineEvent('god-conversation',[60,90],'신과의 대화','초자연','잠과 깨어 있음 사이에서 오래전 이름들이 들립니다. 빛과 어둠의 신이 당신의 생을 묻습니다.',[defineChoice('빛의 신에게 답한다',{faith:3,happiness:1},"“빛의 신에게 답한다”를 선택했습니다. 마음속 믿음이 어려운 순간을 버티는 힘이 되었습니다."),defineChoice('어둠의 신과 거래한다',{curse:3,mana:2},"“어둠의 신과 거래한다”를 선택했습니다. 금기의 흔적이 마음 깊은 곳에 새겨졌습니다."),defineChoice('스스로의 선택을 고백한다',{knowledge:2,honor:1},"“스스로의 선택을 고백한다”를 선택했습니다. 관찰과 질문은 주변 어른들의 관심을 끌었습니다.")])

  const additions=[

    extra('winter-fever',[0,6],'겨울 열병','가족','긴 겨울밤, 열이 오른 당신을 두고 집안이 분주해집니다. 치료사는 약초와 기도 중 하나를 먼저 택하라고 합니다.',[['약초를 달여 먹는다',{health:2,knowledge:1},'쓴 약을 견딘 뒤 열이 가라앉았습니다.','herbal-cure'],['신전의 축복을 청한다',{faith:2,relation:1},'사제의 기도가 가족에게도 위안을 주었습니다.','temple-blessing'],['간병하는 이의 손을 꼭 잡는다',{happiness:1,relation:2},'밤새 곁을 지킨 사람과 깊은 유대가 생겼습니다.','nursed-bond']]),
    extra('toy-sword',[0,6],'나무 검의 주인','성장','아버지가 손바닥만 한 나무 검을 깎아 주었습니다. 형제들은 벌써 누가 더 강한지 겨루자고 조릅니다.',[['멋진 이름을 붙여 검을 아낀다',{honor:1,happiness:2},'작은 검은 가장 오래 간 첫 보물이 되었습니다.','toy-kept'],['형제와 장난 결투를 한다',{sword:1,relation:2},'넘어지고 웃으며 서로의 버릇을 익혔습니다.','sibling-duel'],['검 대신 나무 말을 만든다',{knowledge:2,eloquence:1},'이야기를 꾸며 가족에게 들려주었습니다.','storyteller-seed']]),
    extra('garden-pond',[0,6],'정원의 작은 연못','모험','정원 연못에서 은빛 물고기 한 마리가 수면 위로 뛰어오릅니다. 물가에는 떨어진 열쇠와 울고 있는 정원사가 보입니다.',[['물고기를 따라 연못을 살핀다',{knowledge:2,magic:1},'돌 밑에서 오래된 별 모양 장식을 발견했습니다.','star-charm'],['정원사의 열쇠를 찾아준다',{relation:2,faith:1},'정원사는 고마움의 표시로 꽃 이름을 가르쳐 주었습니다.','garden-favor'],['물고기에게 빵을 나눠준다',{happiness:2,health:1},'물고기가 다시 찾아오며 정원의 작은 친구가 되었습니다.','pond-friend']]),
    extra('first-snow',[0,6],'첫눈의 발자국','가족','밤사이 첫눈이 내렸습니다. 창밖의 정원은 새하얗고, 어른들은 아직 잠들어 있습니다.',[['눈 위에 첫 발자국을 남긴다',{happiness:2,health:1},'눈밭을 달린 뒤 따뜻한 담요 속에서 잠들었습니다.','first-snowprint'],['눈사람을 만들어 가족을 깨운다',{relation:2,eloquence:1},'잠에서 깬 가족들이 함께 웃으며 눈사람에 모자를 씌웠습니다.','snow-family'],['유리창에 서린 글자를 그린다',{knowledge:2,magic:1},'손가락으로 그린 문양이 잠깐 푸르게 빛났습니다.','frost-glyph']]),
    extra('market-puppet',[0,6],'광장의 꼭두각시','가족','시장 광대가 꼭두각시로 옛 영웅의 이야기를 들려줍니다. 공연이 끝나자 인형 하나가 무대 아래로 떨어졌습니다.',[['인형을 주인에게 돌려준다',{relation:2,honor:1},'광대는 다음 공연의 첫 자리를 약속했습니다.','puppet-kindness'],['영웅의 마지막 장면을 묻는다',{knowledge:2,eloquence:1},'전설의 빈틈에 관한 새로운 이야기를 들었습니다.','hero-question'],['인형극을 따라 해본다',{happiness:2,eloquence:1},'당신의 흉내에 시장 사람들이 박수를 보냈습니다.','puppet-play']]),
    extra('old-key',[0,6],'벽난로 뒤의 열쇠','초자연','벽난로 뒤에서 낡은 열쇠를 찾았습니다. 열쇠 머리에는 가문의 문장과 다른 낯선 별이 새겨져 있습니다.',[['가족에게 열쇠를 보여준다',{relation:2,knowledge:1},'어른들은 서로 눈빛을 주고받고 오래된 궤를 열었습니다.','family-key'],['열쇠의 문양을 종이에 옮긴다',{magic:1,knowledge:2},'문양을 본 서기관이 잊힌 왕조의 표식이라 말했습니다.','copied-key'],['혼자 장난감 상자를 열어본다',{happiness:1,strategy:2},'상자 안에서 오래된 동전과 쪽지를 발견했습니다.','hidden-note']]),
    extra('dwarf-lullaby',[0,6],'돌의 자장가','가족','광산에서 온 친척이 낮은 목소리로 돌과 산의 노래를 부릅니다.',[['박자를 손뼉으로 따라간다',{happiness:1,relation:2},'친척은 웃으며 광산 일꾼들의 노래를 더 들려주었습니다.','stone-song'],['노랫말의 뜻을 묻는다',{knowledge:2,faith:1},'노래는 땅속에서 길을 잃은 이들을 집으로 부르는 기도였습니다.','song-meaning'],['낮은 음을 흉내 내본다',{eloquence:1,mana:2},'가슴 깊은 곳에서 작은 울림이 따라왔습니다.','echo-voice']],c=>c.land.nation==='카르딘 왕국','dwarf-lullaby'),

    // 7–14: twelve formative choices
    extra('first-errand',[7,14],'첫 심부름','성장','장터의 약방까지 편지를 전하라는 심부름을 받았습니다. 길목에서 비가 쏟아지고 두 갈래 길이 나타납니다.',[['지름길 골목으로 달린다',{health:-1,strategy:2},'젖은 편지는 무사히 도착했고 골목 지도를 기억했습니다.','knows-shortcut'],['큰길에서 상인에게 길을 묻는다',{eloquence:2,relation:1},'상인은 길 안내와 함께 장터의 소문도 전해주었습니다.','market-contact'],['비를 피해 처마 밑 사람들을 돕는다',{faith:1,happiness:2},'심부름은 늦었지만 낯선 이들의 감사 인사를 받았습니다.','helped-travelers']]),
    extra('apprentice-choice',[7,14],'견습 자리를 고르다','성장','마을의 세 장인이 견습생을 찾습니다. 대장간, 필사실, 약초방 중 한 곳에서 배울 수 있습니다.',[['대장간에서 망치를 잡는다',{sword:1,knowledge:2},'불과 쇠의 성질을 몸으로 익혔습니다.','smith-apprentice'],['필사실에서 기록을 정리한다',{knowledge:2,strategy:1},'낡은 기록 사이에서 사라진 영지 이름을 발견했습니다.','scribe-apprentice'],['약초방에서 재료를 분류한다',{health:1,magic:2},'약초의 향과 마력의 차이를 구별하기 시작했습니다.','herbal-apprentice']]),
    extra('guild-test',[7,14],'길드의 견습 시험','성장','도시 길드가 아이들을 대상으로 작은 시험을 엽니다. 심부름, 셈, 협상 가운데 재능을 보여줄 차례입니다.',[['복잡한 장부를 빠르게 푼다',{knowledge:2,strategy:1},'길드 서기가 주말마다 배울 기회를 주었습니다.','guild-learner'],['값을 흥정해 재료를 구한다',{eloquence:2,happiness:1},'상인은 당신의 배짱을 기억하고 다음 거래를 맡겼습니다.','guild-bargainer'],['다른 아이와 힘을 합친다',{relation:2,honor:1},'함께 시험을 치른 아이와 오랜 우정을 나누었습니다.','guild-friend']]),
    extra('border-post',[7,14],'국경 초소의 전령','전쟁','국경 초소에 보내야 할 봉인이 사라졌습니다. 병사들이 서로를 의심하는 가운데 당신은 마지막으로 봉인을 본 사람입니다.',[['초소 주변의 눈자국을 살핀다',{knowledge:2,strategy:1},'봉인은 바람에 날아간 것이 아니라 매복자의 손에 있었습니다.','spotted-scout'],['병사들에게 차분히 물어본다',{eloquence:2,relation:1},'겁먹은 보초가 봉인을 숨긴 까닭을 털어놓았습니다.','trusted-scout'],['지휘관에게 즉시 알린다',{honor:2,faith:1},'초소가 경계를 강화해 작은 습격을 막았습니다.','raised-alarm']]),
    extra('rune-apprentice',[7,14],'룬 대장장이의 제안','성장','카르딘의 장인이 당신이 망치질하는 모습을 지켜보다 룬 견습을 권합니다.',[['룬의 획을 정밀하게 새긴다',{knowledge:2,mana:1},'첫 룬은 희미하게 빛나며 작은 도구를 단단하게 만들었습니다.','rune-student'],['불꽃의 흐름을 읽는다',{magic:2,health:1},'대장간의 열기 속에서 마력의 맥동을 느꼈습니다.','forge-sense'],['장인의 안전 규칙부터 익힌다',{strategy:1,honor:2},'실수를 줄이는 태도 덕분에 장인은 중요한 작업을 맡겼습니다.','careful-craft']],c=>c.land.nation==='카르딘 왕국','rune-apprentice'),
    extra('forest-spirits',[7,14],'숲의 길잡이 정령','초자연','그린할로우 숲에서 길을 잃은 당신 앞에 여우 모양의 작은 정령이 나타납니다.',[['정령의 뒤를 조심스레 따른다',{magic:2,health:1},'정령은 안전한 오솔길까지 안내하고 나뭇잎 표식을 남겼습니다.','forest-guide'],['자신의 이름을 먼저 밝힌다',{eloquence:1,relation:2},'정령은 약속을 기억하겠다며 작은 씨앗을 건넸습니다.','spirit-pact-small'],['정령이 두려워하는 소리를 찾는다',{knowledge:2,faith:1},'숲의 균열에서 새어 나온 검은 바람이 정령을 놀라게 했습니다.','noticed-rift']],c=>c.land.nation==='그린할로우 왕국'||c.blood.includes('엘프'),'first-dream'),
    extra('archive-scrap',[7,14],'불탄 기록의 조각','초자연','수도 기록 보관소의 작은 화재 뒤, 재 속에서 지워지지 않은 한 문장을 발견합니다.',[['문장을 옮겨 적어 학자에게 보인다',{knowledge:2,relation:1},'학자는 문장이 오래된 왕실 혈통 기록의 일부라며 비밀을 지켰습니다.','archive-clue'],['불탄 흔적을 따라 조사한다',{strategy:2,magic:1},'누군가 기록을 태우기 전 마법 봉인을 풀려 했습니다.','archive-suspect'],['문장을 신전에 맡긴다',{faith:2,honor:1},'신관은 기록을 봉인하고 언젠가 다시 물어보겠다고 했습니다.','sealed-record']]),
    extra('animal-rescue',[7,14],'덫에 걸린 늑대','모험','산길에서 어린 늑대가 사냥 덫에 걸렸습니다. 어미의 울음이 멀리서 메아리칩니다.',[['덫을 풀고 물러난다',{health:-1,faith:2},'늑대는 숲으로 돌아갔고 눈밭에 발자국 하나를 남겼습니다.','wolf-mercy'],['사냥꾼을 불러 함께 돕는다',{eloquence:1,relation:2},'사냥꾼은 덫을 거두고 당신에게 활 쏘는 법을 가르쳤습니다.','hunter-ally'],['덫의 구조를 관찰한다',{knowledge:2,strategy:1},'다음에는 같은 덫을 쉽게 알아볼 수 있게 되었습니다.','trap-lore']]),
    extra('temple-choir',[7,14],'신전 합창단','가족','마을 신전에서 어린 합창단원을 모집합니다. 노래를 잘하는 사람보다 성실한 마음을 찾는다고 합니다.',[['매일 연습에 참석한다',{faith:2,eloquence:1},'합창단의 목소리가 하나로 어우러지고 사제와 가까워졌습니다.','temple-chorister'],['낮은 목소리로 반주를 맡는다',{knowledge:1,happiness:2},'당신의 박자 감각이 합창을 안정시켰습니다.','choir-accompanist'],['병든 단원을 대신해 돕는다',{relation:2,honor:1},'그 단원은 회복 뒤 당신에게 노래를 가르쳤습니다.','choir-kindness']]),
    extra('winter-shelter',[7,14],'산장에 갇힌 밤','모험','폭설로 산길이 막히고 여행자 몇 명이 낡은 산장에 모였습니다. 장작과 식량이 하루치뿐입니다.',[['장작을 아껴 불을 지킨다',{strategy:2,health:1},'모두 무사히 밤을 넘기고 다음 날 구조대와 만났습니다.','shelter-survived'],['여행자들의 사연을 듣는다',{relation:2,knowledge:1},'세상 곳곳의 이야기를 들으며 먼 길에 대한 꿈을 품었습니다.','traveler-stories'],['눈길을 살펴 구조 신호를 만든다',{health:-1,eloquence:2},'멀리서 신호를 본 산악 안내인이 일행을 찾아왔습니다.','signal-rescue']]),
    extra('noble-ball',[7,14],'가면무도회의 실수','정치','귀족 아이들이 처음으로 가면무도회에 초대되었습니다. 가면을 쓴 손님은 당신을 다른 집안의 후계자로 착각합니다.',[['착각을 바로잡는다',{honor:2,eloquence:1},'상대 가문은 정직함을 높이 사며 교류를 이어갔습니다.','honest-introduction'],['상대의 말을 더 들어본다',{knowledge:2,strategy:1},'경쟁 가문 사이에 숨은 혼담의 조건을 알게 되었습니다.','heard-marriage-secret'],['춤으로 분위기를 넘긴다',{happiness:2,relation:1},'어색한 순간은 웃음으로 바뀌고 친구가 생겼습니다.','dance-friend']],c=>c.rank.includes('귀족')),
    extra('half-blood-reveal',[7,14],'거울에 비친 혈통','초자연','오래된 거울에 비친 당신의 눈동자가 잠깐 다른 빛을 띱니다. 가족 중 한 사람이 그 모습을 보고 숨을 삼킵니다.',[['가족에게 진실을 묻는다',{relation:2,knowledge:1},'가족은 혈통의 일부를 고백하고 더 이야기할 때를 약속했습니다.','blood-question'],['거울을 덮고 조용히 기다린다',{strategy:2,happiness:1},'서두르지 않기로 한 선택은 가족의 신뢰를 지켰습니다.','blood-patience'],['신전의 감별을 청한다',{faith:2,magic:1},'사제는 당신의 힘이 축복인지 저주인지 아직 판단할 수 없다고 했습니다.','blood-exam']],c=>c.blood!=='인간','first-dream'),

    // 15–24: fourteen turning points
    extra('duel-provocation',[15,24],'모욕을 건 결투장','정치','연회에서 공개적으로 모욕을 당했습니다. 상대는 새벽 결투를 요구하고, 목격자들은 당신의 답을 기다립니다.',[['정식 결투로 명예를 세운다',{sword:2,honor:2},'상처를 입었지만 상대는 공개 사과를 했습니다.','won-public-duel'],['모욕의 배후를 조사한다',{knowledge:2,strategy:2},'결투는 누군가 꾸민 정치적 함정임이 드러났습니다.','uncovered-duel-plot'],['증인 앞에서 화해를 제안한다',{eloquence:2,faith:1},'당신의 태도는 싸움을 막고 중재자를 얻었습니다.','avoided-duel']]),
    extra('mercenary-offer',[15,24],'용병단의 붉은 깃발','전쟁','전장을 떠도는 용병단이 당신의 검술이나 판단력을 보고 입단을 제안합니다.',[['계약서를 꼼꼼히 확인한다',{knowledge:2,strategy:1},'불리한 조항을 찾아내 조건을 고쳤습니다.','fair-contract'],['전우들과 함께 훈련한다',{sword:2,relation:1},'험한 훈련 끝에 당신을 믿는 동료들이 생겼습니다.','mercenary-comrades'],['민간인 보호를 계약에 넣는다',{honor:2,eloquence:1},'단장은 처음에는 불평했지만 당신의 조건을 받아들였습니다.','protected-civilians']]),
    extra('magic-awakening',[15,24],'마력의 첫 폭주','초자연','감정이 격해진 순간 마력이 통제 밖으로 번져 주변의 등불을 모두 꺼뜨립니다.',[['마력의 흐름을 호흡으로 붙든다',{magic:2,mana:2},'힘은 가라앉았고 마력을 다루는 첫 감각을 얻었습니다.','controlled-awakening'],['사람들을 먼저 대피시킨다',{relation:2,honor:1},'누구도 다치지 않았고 이웃은 당신의 침착함을 기억했습니다.','safe-awakening'],['마탑에 도움을 요청한다',{knowledge:2,magic:1},'마탑의 수련생이 안정화 의식을 가르쳐 주었습니다.','tower-contact']],c=>c.magic>=8||c.mana>=15,'first-dream'),
    extra('secret-courtship',[15,24],'편지에 숨긴 마음','사랑','이름을 밝히지 않은 사람이 책 사이에 짧은 편지를 끼워두었습니다. 글씨는 궁정 서기관의 필체와 닮았습니다.',[['답장을 남기고 기다린다',{eloquence:2,happiness:1},'다음 편지에는 만날 장소가 적혀 있었습니다.','secret-letter'],['편지의 주인을 찾아 나선다',{knowledge:1,relation:2},'도서관에서 같은 책을 찾던 사람과 마주쳤습니다.','found-letter-writer'],['편지를 보관하고 신중히 생각한다',{strategy:2,happiness:1},'서두르지 않은 덕분에 소문을 피하고 진심을 확인했습니다.','careful-courtship']]),
    extra('inheritance-test',[15,24],'가문의 유산 시험','가족','선대가 남긴 유산은 금화가 아니라 세 가지 질문으로 봉인되어 있습니다. 답에 따라 물려받을 책임이 달라집니다.',[['가문의 명예를 우선한다',{honor:2,faith:1},'당신은 낡은 봉인을 풀고 가문의 약속을 이어받았습니다.','inherited-oath'],['유산의 장부를 검토한다',{knowledge:2,strategy:1},'숨겨진 빚과 함께 오래된 기부 기록도 발견했습니다.','inheritance-ledger'],['가족 모두와 답을 의논한다',{relation:2,eloquence:1},'유산은 한 사람의 권력이 아니라 가족 공동의 책임이 되었습니다.','shared-inheritance']],c=>c.family==='명문'||c.family==='몰락'),
    extra('dragon-rider',[15,24],'용의 그림자','모험','산맥을 넘던 길에 거대한 날개가 태양을 가립니다. 추락한 용의 비늘 하나가 바위에 박혀 있습니다.',[['비늘을 건드리지 않고 물러난다',{health:1,faith:2},'용은 당신을 바라보다 말없이 산 너머로 사라졌습니다.','dragon-spared'],['용의 흔적을 기록한다',{knowledge:2,magic:1},'비늘의 문양은 당신의 혈통과 묘하게 닮아 있었습니다.','dragon-trace'],['부상한 용에게 물을 건넨다',{health:-1,relation:2},'용은 떠나기 전 작은 비늘 조각을 발치에 남겼습니다.','dragon-kindness']],c=>c.blood.includes('용인')||c.blood.includes('반신'),'falling-star'),
    extra('assassin-contract',[15,24],'검은 봉투의 의뢰','어둠','얼굴 없는 중개자가 검은 봉투를 건넵니다. 의뢰 대상은 전쟁을 부추기는 부패한 관리라고 적혀 있습니다.',[['대상의 죄를 먼저 확인한다',{knowledge:2,honor:1},'증거는 사실이었지만 살해 외에 공개할 방법도 찾았습니다.','verified-contract'],['의뢰를 거절하고 증거를 모은다',{faith:1,strategy:2},'중개자는 사라졌지만 당신은 길드의 표적이 되었습니다.','refused-contract'],['가짜 의뢰를 꾸며 함정을 놓는다',{eloquence:2,curse:1},'길드의 연락책을 잡았지만 어둠의 세력과 악연이 시작되었습니다.','trapped-handler']],c=>c.land.nation==='리베르타 왕국'||c.rank.includes('부랑아')),
    extra('desert-ruins',[15,24],'모래 아래의 봉인','모험','자하르 대상단이 모래폭풍 뒤 드러난 유적을 발견했습니다. 돌문에는 물과 피를 함께 바치라는 문장이 있습니다.',[['문장을 해독하고 우회로를 찾는다',{knowledge:2,strategy:1},'안전한 통로를 찾아 유물을 훼손하지 않고 회수했습니다.','ruins-route'],['대상단과 함께 문을 지킨다',{sword:1,relation:2},'약탈자들을 막아낸 뒤 유적의 일부를 조사할 허가를 얻었습니다.','guarded-ruins'],['유적을 신전의 보호에 맡긴다',{faith:2,honor:1},'사제들은 봉인을 강화하고 당신을 탐험대의 증인으로 기록했습니다.','ruins-sealed']],c=>c.land.nation==='오시리스 왕국'||c.land.nation==='자하르 왕국','desert-ruins'),
    extra('pirate-capture',[15,24],'해적선의 포로','전쟁','항해 중 해적에게 붙잡혀 선실에 갇혔습니다. 선장과 선원 사이에는 보물 분배를 두고 균열이 있습니다.',[['선원들의 불만을 부추긴다',{eloquence:2,strategy:1},'다툼이 벌어진 틈에 포로들이 갑판을 장악했습니다.','escaped-pirates'],['선장에게 거래를 제안한다',{knowledge:1,eloquence:2},'당신은 자유를 얻었고 해적의 항로 정보를 챙겼습니다.','bargained-pirates'],['쇠사슬을 풀어 동료를 구한다',{health:-1,relation:2},'다친 동료들과 함께 바다로 뛰어들어 구조되었습니다.','rescued-prisoners']],c=>c.land.nation==='코르세아 왕국'||c.land.nation==='스칼드 왕국','pirate-capture'),
    extra('court-debate',[15,24],'궁정의 첫 변론','정치','귀족 회의에서 새 관세가 논의됩니다. 작은 상인과 항구 노동자에게 큰 부담이 될 안건입니다.',[['수치를 들어 반대 의견을 펼친다',{knowledge:2,eloquence:1},'회의는 유예되었고 상인 조합이 자료를 보내왔습니다.','tax-debate'],['상인과 귀족의 절충안을 만든다',{strategy:2,relation:1},'수정안이 통과되어 양쪽의 지지를 얻었습니다.','brokered-tax'],['표결보다 민심을 먼저 듣는다',{faith:1,honor:2},'주민의 청원이 공식 의제로 올라갔습니다.','heard-commoners']],c=>c.rank.includes('귀족')||c.rank.includes('상인')),
    extra('plague-village',[15,24],'국경 마을의 역병','가족','국경 마을에 원인 모를 병이 퍼졌습니다. 치료사는 약재가 부족하고 군대는 마을을 봉쇄하려 합니다.',[['격리와 치료를 함께 설계한다',{knowledge:2,faith:1},'확산은 느려졌고 치료에 필요한 시간을 벌었습니다.','contained-plague'],['약재를 구하러 위험한 숲에 간다',{health:-2,relation:2},'약초를 가져온 당신은 마을 사람들의 생명을 구했습니다.','found-medicine'],['군 지휘관과 협상한다',{eloquence:2,honor:1},'봉쇄는 유지되었지만 식량과 의약품이 마을에 들어왔습니다.','negotiated-aid']]),
    extra('siblings-inheritance',[15,24],'후계자 지명','정치','가문의 수장이 후계자 후보를 발표하려 합니다. 형제자매들은 당신이 어느 편에 설지 지켜봅니다.',[['가장 준비된 이를 공개 지지한다',{honor:2,relation:1},'선택받은 후계자는 당신을 가까운 조언자로 삼았습니다.','backed-heir'],['형제자매의 합의를 제안한다',{eloquence:2,strategy:1},'후계자의 권한과 다른 이들의 역할이 명문화되었습니다.','family-compact'],['후계 경쟁에서 물러난다',{happiness:2,faith:1},'책임은 피했지만 가족과의 신뢰는 지킬 수 있었습니다.','left-succession']]),
    extra('rival-school',[15,24],'마법 학파의 공개 논쟁','성장','미르나스 학원에서 두 학파가 같은 고대 주문의 해석을 두고 공개 논쟁을 벌입니다.',[['실험으로 두 이론을 검증한다',{magic:2,knowledge:2},'재현 가능한 결과를 얻어 학원 연구실의 초대를 받았습니다.','tested-theory'],['서로의 용어를 정리해 중재한다',{eloquence:2,relation:1},'두 학파는 공동 연구를 시작하기로 합의했습니다.','bridged-schools'],['주문을 직접 시전해 본다',{mana:2,magic:2,health:-1},'주문은 성공했지만 위험한 힘을 다루는 법을 배워야 했습니다.','cast-disputed-spell']],c=>c.land.nation==='미르나스 왕국'||c.rank==='마법사 / 성직자'),
    extra('pilgrim-road',[15,24],'순례자의 끊어진 다리','모험','산악 순례길의 다리가 무너져 여행자들이 계곡 양쪽에 고립되었습니다. 비구름은 더 짙어집니다.',[['밧줄을 묶어 임시 통로를 만든다',{health:-1,strategy:2},'여행자들은 무사히 건넜고 당신은 위험한 지형을 익혔습니다.','built-crossing'],['마을에 구조대를 요청한다',{eloquence:2,relation:1},'마을 사람들과 함께 안전한 우회로를 안내했습니다.','called-rescuers'],['순례자들의 식량을 나눠 대기한다',{faith:2,happiness:1},'비가 그친 뒤 모두 함께 복구 작업을 시작했습니다.','shared-pilgrim-food']]),

    // 25–39: fourteen adult lives and political consequences
    extra('harvest-crisis',[25,39],'흉작과 비어가는 창고','정치','비가 오지 않아 영지의 수확량이 절반으로 줄었습니다. 봄까지 버틸 곡식은 두 달치뿐입니다.',[['귀족의 곡물 창고를 개방한다',{honor:2,relation:2},'주민들은 겨울을 났고 영지의 신뢰가 회복되었습니다.','opened-granaries'],['곡물 수입과 배급을 계약한다',{strategy:2,eloquence:1},'가격은 올랐지만 기근을 막을 공급망이 마련되었습니다.','grain-contract'],['다음 농사를 위한 관개를 시작한다',{knowledge:2,health:-1},'당장의 배고픔은 남았지만 다음 해의 위험을 낮췄습니다.','irrigation-project']]),
    extra('royal-betrothal',[25,39],'왕실의 혼인 동맹','정치','이웃 왕국의 사절이 혼인 동맹을 제안합니다. 조건에는 국경 요새와 상속권 문제가 숨어 있습니다.',[['조약 조항을 세밀히 협상한다',{eloquence:2,knowledge:1},'혼인보다 오래갈 상호 방위 조항을 얻었습니다.','marriage-treaty'],['상대 왕족을 직접 만나 판단한다',{relation:2,strategy:1},'사절단의 공식 기록과 다른 솔직한 의견을 들었습니다.','met-royalty'],['동맹을 거절하고 제삼국과 접촉한다',{honor:1,strategy:2},'당장의 결혼은 피했지만 외교 경쟁이 시작되었습니다.','rejected-alliance']],c=>c.rank.includes('황족')||c.rank.includes('왕족')),
    extra('merchant-route',[25,39],'새로운 무역로','정치','발렌 상인들이 산맥을 가로지르는 새 무역로를 제안합니다. 도로 건설은 일자리를 만들지만 인근 숲을 훼손할 수 있습니다.',[['주민과 환경 조사를 먼저 진행한다',{knowledge:2,relation:1},'노선이 수정되어 마을과 숲의 피해를 줄였습니다.','surveyed-route'],['상단과 수익을 나눈다',{eloquence:2,happiness:1},'영지에 안정적인 통행세와 일자리가 생겼습니다.','shared-route-profit'],['길드 간 경쟁을 이용해 조건을 높인다',{strategy:2,honor:1},'유리한 조건을 얻었지만 상단의 견제가 시작되었습니다.','won-route-bid']],c=>c.land.nation==='발렌 왕국'||c.rank.includes('상인'),'merchant-route',{extraChoices:()=>[defineChoice('18G를 투자해 새 무역로를 연다',{gold:-18,eloquence:2,honor:1},'첫 교역품이 도착했고 투자금 일부가 돌아오기 시작했습니다.','opened-trade-route')]}),
    extra('court-spy',[25,39],'궁정의 두 번째 그림자','정치','궁정 회의의 내용이 매번 적국에 흘러갑니다. 믿을 수 있는 측근은 세 명뿐이고 증거는 없습니다.',[['가짜 회의 안건을 흘려본다',{strategy:2,knowledge:1},'적국이 움직이며 정보원의 정체가 드러났습니다.','caught-spy'],['측근을 개별 면담한다',{eloquence:2,relation:1},'한 측근이 협박을 받고 있었다고 고백했습니다.','rescued-informant'],['회의 기록과 출입 명부를 대조한다',{knowledge:2,honor:1},'증거를 확보하고 공개 심문 절차를 열었습니다.','documented-spy']]),
    extra('guild-strike',[25,39],'길드의 파업','정치','장인 길드가 임금과 안전 문제로 작업을 멈췄습니다. 왕실은 강제 해산을 요구합니다.',[['길드 대표와 공개 협상한다',{eloquence:2,relation:1},'안전 규정과 임금 조정안을 함께 마련했습니다.','guild-agreement'],['임시 작업장을 직접 마련한다',{health:-1,honor:2},'필수 물자는 공급됐지만 근본 해결을 위한 대화가 이어졌습니다.','emergency-workshop'],['생산 기록을 공개해 손실을 따진다',{knowledge:2,strategy:1},'숨겨진 이익 배분이 드러나 협상의 기준이 바뀌었습니다.','revealed-guild-books']] ),
    extra('curse-investigation',[25,39],'가문에 번지는 저주','초자연','가족들이 같은 악몽을 꾸기 시작했습니다. 오래된 초상화의 눈에는 밤마다 검은 얼룩이 번집니다.',[['신전과 함께 정화 의식을 치른다',{faith:2,health:1},'악몽은 잦아들고 저주의 근원이 된 오래된 맹세를 찾았습니다.','purified-curse'],['가문의 계보와 계약을 조사한다',{knowledge:2,magic:1},'저주는 조상과 지하 유적의 거래에서 비롯되었습니다.','traced-curse'],['저주의 일부를 자신에게 묶는다',{mana:2,curse:2,relation:1},'가족은 편해졌지만 어둠의 흔적이 당신에게 남았습니다.','shared-curse']]),
    extra('orphanage-funding',[25,39],'고아원의 겨울 후원','가족','도시 고아원은 난방비가 끊겨 문을 닫을 위기입니다. 자선가들은 후원금이 어디에 쓰이는지 의심합니다.',[['회계 장부를 공개하고 후원한다',{honor:2,knowledge:1},'투명한 기록 덕분에 다른 후원자들도 합류했습니다.','funded-orphanage'],['고아들에게 기술 교육을 마련한다',{relation:2,strategy:1},'아이들은 스스로 생계를 꾸릴 첫 기술을 배웠습니다.','orphan-training'],['도시 길드와 장기 계약을 맺는다',{eloquence:2,happiness:1},'고아원은 안정적인 일자리와 보호를 함께 제공하게 되었습니다.','guild-orphanage']],c=>c.rank.includes('황족')||c.rank.includes('귀족')||c.honor>=35),
    extra('naval-blockade',[25,39],'항구 봉쇄','전쟁','적국 함대가 항구를 봉쇄했습니다. 식량선은 들어오지 못하고 선원들은 돌파 작전을 요구합니다.',[['밤바다의 암초길을 정찰한다',{strategy:2,health:-1},'작은 선단이 봉쇄를 피해 식량을 실어왔습니다.','secret-channel'],['중립 상단을 통한 휴전을 제안한다',{eloquence:2,relation:1},'짧은 휴전으로 민간 선박이 항구에 들어왔습니다.','naval-truce'],['해안 포대를 재배치한다',{knowledge:1,sword:2},'봉쇄 함대는 거리를 두었고 항구 방어가 강화되었습니다.','fortified-harbor']],c=>c.land.nation==='코르세아 왕국'||c.land.nation==='발렌 왕국','naval-blockade'),
    extra('dragon-egg',[25,39],'불타지 않는 알','초자연','용의 둥지에서 발견된 알이 며칠째 식지 않는 불꽃을 뿜습니다. 각국 사절이 소유권을 주장합니다.',[['알을 중립 성소에 맡긴다',{faith:2,honor:1},'성소는 어느 왕국도 독점하지 못하도록 보호를 선언했습니다.','egg-sanctuary'],['알의 마력을 측정한다',{knowledge:2,magic:1},'알은 곧 깨어날 생명의 박동에 맞춰 반응했습니다.','egg-studied'],['용의 흔적을 찾아 부모를 찾는다',{health:-1,relation:2},'산맥 너머에서 알을 찾던 용의 울음이 들려왔습니다.','found-dragon-parent']],c=>c.blood.includes('용인')||c.magic>=18,'falling-star'),
    extra('rebellion-petition',[25,39],'세금 철폐 청원','정치','농민 대표가 과도한 세금을 없애달라는 청원서를 들고 성문 앞에 섰습니다. 귀족들은 이를 반란의 시작이라 부릅니다.',[['청원 대표들을 직접 만난다',{relation:2,eloquence:1},'세금의 실제 부담을 확인하고 조정안을 발표했습니다.','met-petitioners'],['귀족 회의에서 수치를 공개한다',{knowledge:2,honor:1},'징수 기록의 비리가 밝혀지고 청원은 정식 의제가 되었습니다.','exposed-tax-abuse'],['치안대를 물리고 평화 집회를 허용한다',{faith:1,strategy:2},'충돌은 막았지만 귀족들의 반발이 커졌습니다.','allowed-assembly']]),
    extra('heir-missing',[25,39],'사라진 후계자','가족','축제의 밤, 어린 후계자가 흔적도 없이 사라졌습니다. 왕실 경비대는 성문을 닫고 서로를 의심합니다.',[['유모와 시종을 차례로 면담한다',{eloquence:2,relation:1},'후계자는 두려움에 숨어 있었고 가족에게 돌아왔습니다.','found-heir-gently'],['성의 비밀 통로를 조사한다',{knowledge:2,strategy:1},'통로에서 납치범의 흔적과 공모자의 인장을 찾았습니다.','found-heir-plot'],['성문을 열어 목격자를 모은다',{honor:1,relation:2},'목격자의 제보가 이어져 성 밖 마차에서 후계자를 찾았습니다.','found-heir-publicly']],c=>c.rank.includes('왕족')||c.rank.includes('황족')),
    extra('alchemist-experiment',[25,39],'연금술사의 유리 정원','성장','칼리파의 연금술사가 식물을 밤새 피우는 약제를 만들었습니다. 작은 부작용을 숨기고 왕실에 납품하려 합니다.',[['시험 결과를 독립적으로 확인한다',{knowledge:2,strategy:1},'약제의 위험성을 밝혀 대량 유통을 막았습니다.','checked-elixir'],['연금술사와 안전한 처방을 다시 만든다',{magic:2,eloquence:1},'부작용을 줄인 약제가 환자 치료에 쓰였습니다.','improved-elixir'],['실험 기록을 공개한다',{honor:2,faith:1},'연구는 중단되었지만 다른 학자들이 안전 기준을 세웠습니다.','published-alchemy']],c=>c.land.nation==='칼리파 왕국'||c.rank==='마법사 / 성직자'),
    extra('relic-auction',[25,39],'금지 유물의 경매','어둠','비밀 경매에 신들의 서약 이전에 만들어진 유물이 나왔습니다. 마탑과 암시장 양쪽이 높은 값을 부릅니다.',[['유물의 출처를 확인한다',{knowledge:2,eloquence:1},'유물은 도굴품으로 확인되어 정당한 후손에게 돌아갔습니다.','returned-relic'],['경매를 중단시키고 신전에 넘긴다',{faith:2,honor:1},'유물은 봉인되었고 암시장과의 적대가 시작되었습니다.','seized-relic'],['가짜 유물로 경매를 바꿔치기한다',{strategy:2,curse:1},'진품은 보호했지만 누군가 당신의 속임수를 눈치챘습니다.','swapped-relic']],c=>c.land.nation==='리베르타 왕국'||c.land.nation==='오시리스 왕국','black-door',{extraChoices:()=>[defineChoice('25G를 걸고 경매에 참여한다',{gold:-25,knowledge:2,magic:1},'유물을 손에 넣지는 못했지만 경매 기록에서 봉인의 비밀을 발견했습니다.','bid-relic-auction')]}),
    extra('family-name-crisis',[25,39],'가문의 이름을 버릴 것인가','정치','가문이 과거 전쟁의 학살에 연루되었다는 문서가 공개되었습니다. 후손들은 침묵과 사죄 사이에서 갈라집니다.',[['문서를 검증하고 공개 사과한다',{honor:2,faith:1},'사실을 인정한 뒤 배상과 추모 사업을 시작했습니다.','family-apology'],['희생자 유족과 직접 대화한다',{relation:2,eloquence:1},'오랜 원망은 남았지만 화해를 위한 첫 약속을 나눴습니다.','family-reconciliation'],['가문의 문장을 내려놓고 새 이름을 택한다',{happiness:1,strategy:2},'과거의 책임을 이어받되 새로운 정체성으로 살아가기로 했습니다.','changed-house-name']],c=>c.family==='명문'||c.family==='몰락'),

    // 40–59: twelve late-life legacies and crises
    extra('successor-training',[40,59],'후계자 수업의 첫날','가족','후계자가 첫 회의에서 공개적으로 실수를 했습니다. 측근들은 엄한 징계와 관용을 요구합니다.',[['실패의 원인을 함께 분석한다',{knowledge:2,relation:1},'후계자는 다음 회의에서 스스로 오류를 바로잡았습니다.','trained-heir'],['실수를 공개적으로 책임진다',{honor:2,eloquence:1},'측근의 비난은 당신에게 향하고 후계자는 다시 배울 기회를 얻었습니다.','shielded-heir'],['경험 많은 조언자를 곁에 둔다',{strategy:2,happiness:1},'후계자는 도움을 받아들이고 점차 자기 판단을 키웠습니다.','heir-mentor']]),
    extra('retired-knight',[40,59],'마지막 검무','성장','오래된 검술 스승이 은퇴를 앞두고 제자들에게 마지막 검무를 보여달라고 청합니다.',[['스승의 옛 검식을 그대로 잇는다',{sword:2,honor:1},'스승은 당신에게 자신의 목검을 물려주었습니다.','inherited-sword-form'],['새 시대에 맞게 검식을 바꾼다',{knowledge:2,sword:1},'스승은 변화를 인정하고 제자들에게 새 방식을 가르치라 했습니다.','new-sword-form'],['제자들과 함께 합을 맞춘다',{relation:2,happiness:1},'마지막 수련은 승패보다 함께한 시간을 기념했습니다.','last-training']]),
    extra('city-fire',[40,59],'수도 대화재','모험','강풍이 부는 밤, 수도의 창고에서 불길이 번졌습니다. 소방대는 한 구역만 먼저 구할 수 있습니다.',[['주민 대피로를 열고 지휘한다',{strategy:2,relation:1},'인명 피해를 줄이고 대피가 질서 있게 끝났습니다.','evacuated-city'],['불길이 번지는 지붕을 직접 막는다',{health:-2,honor:2},'귀한 기록은 일부 잃었지만 불길은 주택가로 번지지 않았습니다.','held-fireline'],['마법사들과 바람의 흐름을 바꾼다',{magic:2,mana:2},'강풍이 잦아들며 진화대가 불길을 통제했습니다.','turned-wind']],c=>c.magic>=12||c.rank.includes('귀족')),
    extra('plague-doctor',[40,59],'치료소의 마지막 약병','가족','역병 치료소의 약이 한 병 남았습니다. 어린 환자와 마을 의원이 동시에 위중해졌습니다.',[['약효와 생존 가능성을 살펴 결정한다',{knowledge:2,faith:1},'의원은 살아남아 더 많은 환자를 돌볼 수 있었습니다.','saved-doctor'],['환자 가족과 함께 선택을 나눈다',{relation:2,eloquence:1},'고통스러운 결정은 공동의 책임이 되었고 가족은 곁을 지켰습니다.','shared-medical-choice'],['약병을 나누어 응급 처치한다',{strategy:2,health:-1},'완전한 치료는 아니었지만 두 환자 모두 고비를 넘겼습니다.','split-medicine']]),
    extra('kingdom-treaty',[40,59],'전쟁을 끝낼 조약','정치','수십 년 이어진 국경 분쟁을 끝낼 조약이 탁자에 놓였습니다. 어느 한 조항은 반드시 양보해야 합니다.',[['포로 송환과 민간인 보호를 우선한다',{faith:2,honor:1},'영토 문제는 남았지만 양국은 포로와 민간인을 돌려보냈습니다.','humanitarian-treaty'],['경계선을 공동 관리 구역으로 둔다',{strategy:2,eloquence:1},'어느 쪽도 완전한 승리를 얻지 못했지만 전투는 멈췄습니다.','shared-border-treaty'],['왕실의 보증을 걸고 휴전을 연장한다',{relation:2,happiness:1},'불안한 평화가 이어지고 다음 협상을 위한 시간이 생겼습니다.','extended-truce']]),
    extra('lost-memory',[40,59],'이름이 흐려지는 병','가족','오래된 기억이 자꾸 사라집니다. 의사는 휴식이 필요하다고 하지만 중요한 회의가 다가옵니다.',[['기록을 남겨 기억을 보완한다',{knowledge:2,strategy:1},'연대기와 편지가 다음 결정을 도와주었습니다.','memory-journal'],['가족과 시간을 보내며 치료를 받는다',{happiness:2,relation:1},'사랑하는 이들과의 시간이 마음을 안정시켰습니다.','family-recovery'],['마법 치료를 받되 대가를 확인한다',{magic:2,mana:-1},'기억은 일부 돌아왔지만 무리한 주문의 위험을 알게 되었습니다.','memory-spell']]),
    extra('old-rival-appeal',[40,59],'옛 적의 탄원','정치','한때 당신을 배신한 옛 적이 사면을 청합니다. 그의 증언은 왕국을 뒤흔들 비밀을 담고 있습니다.',[['증언을 먼저 검증한다',{knowledge:2,strategy:1},'배신자의 말은 사실이었고 오래된 음모의 증거를 얻었습니다.','verified-rival'],['공개 재판에서 변론할 기회를 준다',{honor:2,eloquence:1},'공정한 절차 덕분에 적의 추종자도 폭력을 거두었습니다.','fair-trial-rival'],['사면 대신 추방을 제안한다',{faith:1,happiness:2},'피해자들은 완전히 만족하지 못했지만 복수의 고리는 끊겼습니다.','exiled-rival']]),
    extra('ancient-tree-dying',[40,59],'시들어가는 세계수 가지','초자연','엘로윈의 세계수 가지 하나가 검게 변했습니다. 정령들은 뿌리 아래에서 균열의 울림이 커진다고 경고합니다.',[['정령과 함께 오염된 뿌리를 정화한다',{magic:2,faith:1},'가지의 빛이 돌아오고 균열의 방향을 알아냈습니다.','healed-worldtree'],['학자들과 뿌리의 흐름을 측정한다',{knowledge:2,mana:1},'마력의 흐름이 북쪽의 고대 봉인과 연결됨을 확인했습니다.','mapped-rootflow'],['가지의 일부를 태워 확산을 막는다',{health:-1,honor:2},'큰 희생으로 숲을 지켰지만 정령들의 슬픔이 남았습니다.','sacrificed-branch']],c=>c.land.nation==='엘로윈 왕국'||c.blood.includes('엘프'),'first-dream'),
    extra('legacy-school',[40,59],'변방 학교의 설립','정치','변방 마을의 아이들은 읽기와 셈을 배울 곳이 없습니다. 귀족들은 비용을 내기보다 군사 도로를 원합니다.',[['개인 재산으로 작은 학교를 연다',{honor:2,happiness:1},'첫 졸업생들이 마을의 기록과 거래를 맡기 시작했습니다.','opened-school'],['영지 예산에 학교를 포함한다',{strategy:2,eloquence:1},'논쟁 끝에 여러 마을을 순회하는 교사가 채용되었습니다.','public-school'],['장인 길드와 견습 교육을 묶는다',{knowledge:2,relation:1},'아이들은 읽기와 함께 실제 생업 기술을 배웠습니다.','guild-school']]),
    extra('volcano-evacuation',[40,59],'산 아래의 붉은 빛','모험','휴화산이 흔들리고 붉은 빛이 분화구에서 번집니다. 주변 마을은 대피를 믿지 않는 주민들로 가득합니다.',[['위험을 직접 설명하며 대피를 이끈다',{eloquence:2,relation:1},'마지막 주민까지 안전지대로 이동했습니다.','evacuated-volcano'],['지형과 바람을 분석해 대피 경로를 정한다',{knowledge:2,strategy:1},'재가 덮치기 전 가장 안전한 경로를 확보했습니다.','safe-volcano-route'],['마법 결계로 용암의 흐름을 돌린다',{magic:2,mana:2,health:-1},'용암은 비껴갔지만 마력 소진으로 오래 회복해야 했습니다.','redirected-lava']],c=>c.magic>=15||c.land.continent==='노르헬'),
    extra('secret-descendant',[40,59],'숨겨진 후손의 편지','가족','오래전 추방된 친족의 후손이 도움을 청하는 편지를 보냈습니다. 답장은 가문의 계승권을 흔들 수 있습니다.',[['족보와 봉인을 조사한다',{knowledge:2,strategy:1},'편지의 진위가 확인되고 후손의 존재를 공식 기록했습니다.','verified-descendant'],['가족 회의에서 먼저 사실을 알린다',{relation:2,honor:1},'놀람과 반발 끝에 가족은 후손을 만날 자리를 마련했습니다.','family-descendant-meeting'],['비밀리에 후손의 안전부터 확보한다',{faith:1,eloquence:2},'후손은 보호받았지만 가문 안의 의심이 커졌습니다.','protected-descendant']],c=>c.family==='비밀'||c.family==='명문'),
    extra('border-ghosts',[40,59],'전장의 혼령들','초자연','옛 전쟁터에서 밤마다 군인들의 행렬이 보입니다. 새 도로 공사를 위해 혼령을 달래거나 밀어내야 합니다.',[['양국의 희생자를 함께 추모한다',{faith:2,relation:1},'혼령들은 사라지고 양국 주민이 공동 추모제를 이어갔습니다.','shared-remembrance'],['마탑의 봉인으로 길을 연다',{magic:2,knowledge:1},'도로는 완공됐지만 봉인의 상태를 계속 살펴야 합니다.','sealed-battlefield'],['공사를 중단하고 땅을 보존한다',{honor:2,happiness:1},'길은 우회했지만 전사들의 안식처를 지킬 수 있었습니다.','preserved-battlefield']]),

    // 60+: eight closing chapters
    extra('elderly-journey',[60,90],'다시 찾은 고향길','모험','오래 떠나 있던 고향 마을이 지도에서 사라졌다는 소식을 들었습니다. 길에는 기억과 다른 표지석이 세워져 있습니다.',[['옛 주민을 찾아 함께 걸어간다',{relation:2,health:1},'마을의 흔적을 아는 이들과 오래된 우물을 찾았습니다.','returned-home'],['새 지도에 현재의 길을 기록한다',{knowledge:2,strategy:1},'고향의 이름은 새 지도와 여행자의 이야기 속에 남았습니다.','mapped-homeland'],['옛 성소에서 조용히 기도한다',{faith:2,happiness:1},'고향은 변했지만 마음속에 지켜온 약속은 그대로였습니다.','prayed-home']]),
    extra('apprentice-farewell',[60,90],'제자의 독립 선언','가족','오랫동안 곁에서 배운 제자가 다른 나라로 떠나겠다고 합니다. 제자는 당신이 자신의 길을 허락할지 묻습니다.',[['배운 기술과 작은 유산을 맡긴다',{honor:2,relation:1},'제자는 새로운 곳에서 당신의 가르침을 이어가겠다고 약속했습니다.','released-apprentice'],['함께 마지막 수련을 한다',{sword:1,happiness:2},'두 사람은 스승과 제자에서 오래된 벗이 되었습니다.','trained-apprentice-final'],['위험과 기회를 함께 검토한다',{knowledge:2,eloquence:1},'제자는 준비를 마친 뒤 안전한 길로 떠났습니다.','planned-apprentice-journey']]),

function regionHistoryPathMarkup(character,land){const history=(character?.regionHistory||[]).map(item=>({item,found:findRegionLocation(item.regionId)})).filter(entry=>entry.found?.land.nation===land?.nation);const points=[];for(const entry of history){const point=entry.found.region.x+","+entry.found.region.y;if(points.at(-1)!==point)points.push(point)}if(points.length<2)return "";return "<svg class=\"region-travel-path\" viewBox=\"0 0 100 100\" preserveAspectRatio=\"none\" aria-label=\"방문한 지역 경로\"><polyline points=\""+points.join(" ")+"\"/></svg>"}function worldMapMarkup(character){const view=mapView(),selected=character?.land.continent||'';let heading='다섯 대륙',overlay='',meta='';const landForMap=LAND_DATA.find(item=>item.nation===view.nation)||LAND_DATA.find(item=>item.nation===character?.land.nation);let mapAsset='assets/maps/world-map-v2.png';if(view.level==='kingdom')mapAsset=MAP_CONTINENT_ASSETS[view.continent]||mapAsset;else if(view.level==='location')mapAsset='assets/maps/kingdom-'+(LAND_DATA.find(item=>item.nation===view.nation)?.mapAsset||'arken-empire')+'.png';else if(view.level==='detail')mapAsset=landForMap?'assets/maps/region-'+(landForMap.mapAsset||'arken-empire')+'.png':mapAsset;let detailRegion=null;if(view.level==='continent'){overlay=MAP_CONTINENTS.map(region=>{const nations=LAND_DATA.filter(item=>item.continent===region.name),prosperity=Math.round(nations.reduce((sum,item)=>sum+mapProsperity(character,item.nation),0)/(nations.length||1)),current=region.name===selected;return'<button class="map-pin continent-pin '+(current?'is-current':'')+'" style="left:'+region.x+'%;top:'+region.y+'%" data-action="map-view" data-level="kingdom" data-continent="'+escapeXml(region.name)+'"><b>'+region.name+'</b><small>'+nations.length+'개 왕국 · 번영 '+prosperity+'</small>'+(current?'<em>현재 위치</em>':'')+'</button>'}).join('');meta='대륙을 선택하면 소속 왕국과 세계 상태를 살펴봅니다.';heading='다섯 대륙'}else if(view.level==='kingdom'){heading=view.continent+' · 왕국';const kingdoms=LAND_DATA.filter(item=>item.continent===view.continent);overlay=kingdoms.map((land,index)=>{const [x,y]=KINGDOM_MAP_COORDINATES[land.mapAsset]||[50,50],prosperity=mapProsperity(character,land.nation),war=mapWar(character,land.nation),story=mapCurrentEvent(character,land.nation),current=character?.land.nation===land.nation;return'<button class="map-pin kingdom-pin '+(current?'is-current':'')+'" style="left:'+x+'%;top:'+y+'%" data-action="map-view" data-level="location" data-continent="'+escapeXml(view.continent)+'" data-nation="'+escapeXml(land.nation)+'"><b>'+escapeXml(land.nation)+'</b><small>'+escapeXml(land.capital)+' · 번영 '+prosperity+'</small>'+(war?'<em class="war-mark">전쟁 영향</em>':'')+(story?'<em class="story-mark">인생 사건</em>':'')+(current?'<em>현재 위치</em>':'')+'</button>'}).join('');meta='왕국을 누르면 주요 지역의 분포와 기록을 살펴봅니다.'}else{const land=landForMap;heading=(land?.nation||view.nation)+' · 지역';const regions=land?.regions||[];if(view.level==='location'){overlay=regionHistoryPathMarkup(character,land)+regions.map(region=>{const isBirth=character?.birthRegion?.id===region.id,isCurrent=(character?.currentRegion||character?.birthRegion?.id)===region.id,isVisited=(character?.regionHistory||[]).some(item=>item.regionId===region.id),stateClass=[isCurrent?'is-current':'',isBirth?'is-birthplace':'',isVisited?'is-visited':''].filter(Boolean).join(' ');return'<button class="map-pin region-pin region-'+region.type+' '+stateClass+'" data-region-id="'+escapeXml(region.id)+'" style="left:'+region.x+'%;top:'+region.y+'%" data-action="map-view" data-level="detail" data-continent="'+escapeXml(view.continent)+'" data-nation="'+escapeXml(view.nation)+'" data-location="'+escapeXml(region.name)+'"><span class="region-pin-heading">'+regionTypeIconMarkup(region.type)+'<b>'+escapeXml(region.name)+'</b></span><small>'+escapeXml(regionTypeLabel(region.type))+'</small>'+(isBirth?'<em class="birth-mark">출생지</em>':'')+(isCurrent&&!isBirth?'<em>현재 위치</em>':'')+'</button>'}).join('');meta='지도를 눌러 지역 정보를 살펴봅니다. 이동은 생애 사건과 선택으로만 이루어집니다.'}else{detailRegion=regions.find(region=>region.name===view.location)||regions.find(region=>region.id===character?.birthRegion?.id)||regions[0];if(detailRegion){const isBirth=character?.birthRegion?.id===detailRegion.id,isCurrent=(character?.currentRegion||character?.birthRegion?.id)===detailRegion.id,history=(character?.regionHistory||[]).filter(item=>item.regionId===detailRegion.id),lastVisit=history[history.length-1];overlay='<section class="map-detail-card '+(isBirth?'is-birthplace':'')+'"><div class="map-detail-heading"><span class="region-type-seal region-type-'+escapeXml(detailRegion.type)+'">'+regionTypeIconMarkup(detailRegion.type)+escapeXml(regionTypeLabel(detailRegion.type))+'</span><div><b>'+escapeXml(detailRegion.name)+'</b>'+(isBirth?'<em>출생지</em>':'')+(isCurrent?'<em class="current-region-badge">현재 위치</em>':'')+'</div></div><p>'+escapeXml(detailRegion.description)+'</p><div class="map-region-facts"><span>인구 <b>'+Number(detailRegion.population).toLocaleString('ko-KR')+'</b></span><span>부유도 <b>'+detailRegion.wealth+'/5</b></span><span>위험도 <b>'+detailRegion.danger+'/5</b></span><span>산업 <b>'+escapeXml(detailRegion.industry.join(' · '))+'</b></span><span>명소 <b>'+escapeXml(detailRegion.landmarks.join(' · '))+'</b></span><span>세력 <b>'+escapeXml(detailRegion.factions.join(' · '))+'</b></span></div>'+(lastVisit?'<small class="region-visit-note">마지막 방문 · '+escapeXml(lastVisit.reason||'여정')+' · '+Math.floor((lastVisit.since||0)/365)+'세</small>':'<small class="region-visit-note">아직 발걸음이 닿지 않은 곳</small>')+'</section>'}}meta='지역 상세 기록 · 이동은 사건과 선택에 따라 갱신됩니다.'}const birth=character?.birthRegion&&view.level==='continent'?(()=>{const [x,y]=birthCoordinates(character);return'<span class="birthplace-world-pin" style="left:'+x+'%;top:'+y+'%"><i></i><b>'+escapeXml(character.birthRegion.name)+'</b><small>출생지</small></span>'})():'';return'<div class="map-explorer"><div class="map-explorer-head"><div>'+mapBreadcrumb(view)+'</div><b>'+heading+'</b></div><div class="world-map-illustration map-level-'+view.level+'" role="group" aria-label="아르케니아 탐색 지도" style="background-image:url('+mapAsset+')">'+overlay+birth+((view.level==='location'||view.level==='detail')?kingdomLedgerMarkup(character,landForMap).replace('class="kingdom-map-ledger"','class="kingdom-map-ledger map-hover-ledger"'):'')+'</div><div class="map-explorer-foot"><span>'+meta+'</span><button class="mini-btn" '+mapBackAttributes(view,character)+'>'+(view.level==='continent'?'현재 대륙':view.level==='kingdom'?'대륙으로':view.level==='detail'?'지역 목록':'왕국 목록')+'</button></div></div>'}
function portraitProfessionKey(character){const label=professionFor(character),rank=String(character.rank||'');if(/왕실|황족|왕족|귀족/.test(label)||/황족|왕족|귀족/.test(rank))return'noble';if(/마법|룬|마탑/.test(label))return'mage';if(/성직|사제|신관|신전/.test(label))return'priest';if(/검사|검술|기사|군인|수비|성채/.test(label))return'knight';if(/상인|길드|항만|무역/.test(label))return'merchant';if(/학자|연구|학원|서기관/.test(label))return'scholar';if(/장인|대장장이|공방/.test(label))return'artisan';if(/정령|드루이드|숲/.test(label))return'druid';if(/도적|방랑|생존자|거리/.test(label))return'rogue';return'farmer'}
function portraitAsset(character){const age=Math.max(0,Number(character?.age)||0),ageBand=age<2?'0-1':age<7?'0-6':age<15?'7-14':age<25?'15-24':age<60?'25-59':'60-plus',gender=character?.female?'female':'male',profession=portraitProfessionKey(character);return{src:`assets/portraits/portrait_age${ageBand}_${gender}_${profession}.png`}}
function portraitMarkup(character){const asset=portraitAsset(character),blood=String(character.blood||'인간'),bloodClass=/드워프/.test(blood)?'blood-dwarf':/엘프/.test(blood)?'blood-elf':/수인|야수/.test(blood)?'blood-beast':/용|드래곤/.test(blood)?'blood-dragon':/악마|마족/.test(blood)?'blood-demon':/신성|반신|천족/.test(blood)?'blood-divine':'';return`<div class="portrait-frame ${bloodClass}"><img class="portrait" src="${escapeXml(asset.src)}" alt="${escapeXml(character.name)} 초상화" loading="eager"><span class="portrait-bloodline">${escapeXml(blood)}</span></div>`}
function profilePanel(character){const status=statusDescription(character),tier=healthWarningTier(character.health),statusClass=tier===3?'status-dying':tier===2?'status-critical':tier===1?'status-warning':character.curse>=30?'warning':'';return`<section class="box profile-card"><div class="box-inner">${portraitMarkup(character)}<div class="eyebrow" style="margin-top:13px">${escapeXml(character.land.continent)} · ${escapeXml(character.land.nation)}</div><h2 class="profile-name">${escapeXml(character.name)}</h2><div class="profile-meta">${character.age}세 · ${character.female?'여성':'남성'}<br>${escapeXml(character.rank)} · ${escapeXml(character.family)} 가문<br>${escapeXml(character.blood)}<br><span class="birth-place">${escapeXml(character.birthRegion?.name||character.land.place)} · ${escapeXml(regionTypeLabel(character.birthRegion?.type))}</span></div><div class="profile-role"><span class="profession-sigil">${sigilIconMarkup(professionIconKey(professionFor(character)))}</span><span>${escapeXml(professionFor(character))}</span></div>${ambitionPanelMarkup(character)}<div class="economy-line"><span>소지금</span><b>${ensureEconomy(character).gold}G</b><small>${ensureEconomy(character).gold<0?"빚 상환 필요":"생활 자금"}</small></div><div class="vital"><span>건강</span><div class="bar"><i style="width:${clampStat(character.health)}%;background:linear-gradient(90deg,#843d34,#cf7961)"></i></div><strong>${clampStat(character.health)}</strong></div><div class="vital"><span>행복</span><div class="bar"><i style="width:${clampStat(character.happiness)}%;background:linear-gradient(90deg,#657c4e,#b3bb70)"></i></div><strong>${clampStat(character.happiness)}</strong></div><div class="status-line ${statusClass}">${escapeXml(status)}</div>${character.healthCarePlan?'<div class="status-line care-status">요양 중 · 다음 시간 흐름 뒤 회복</div>':''}${diseaseBadgesMarkup(character)}<div class="profile-tags"><span class="tag">${escapeXml(character.family)} 가문</span><span class="tag">${escapeXml(character.blood)}</span></div><div class="profile-buttons"><button class="mini-btn" data-action="pause-toggle">${character.paused?'▶ 이어보기':'Ⅱ 멈춤'}</button><button class="mini-btn" data-action="record-download">기록 저장</button></div></div></section>`}
function diseaseBadgesMarkup(character){const active=(character.diseases||[]).map(item=>({...item,definition:DISEASES.find(disease=>disease.id===item.id)})).filter(item=>item.definition);if(!active.length)return'';return'<section class="disease-section"><b>질병</b>'+active.map(item=>'<span class="disease-badge '+(item.definition.lethal>=.15?'severe':'')+'">'+escapeXml(item.definition.name)+' <small>'+Math.max(0,Number(item.remaining)||0)+'틱 남음</small></span>').join('')+'</section>'}function statusDescription(character){const tier=healthWarningTier(character.health);if(tier===3)return'☠️ 마지막 숨결이 다가옵니다.';if(tier===2)return'⚠️⚠️ 중병입니다. 죽음이 임박했습니다.';if(tier===1)return'⚠️ 건강이 위험합니다. 회복이 필요합니다.';if(character.diseases?.length)return`질병: ${character.diseases.map(active=>DISEASES.find(item=>item.id===active.id)?.name).filter(Boolean).join(', ')}`;if(character.curse>=30)return'저주의 기운이 일상에 영향을 줍니다.';if(character.happiness<25)return'마음에 깊은 상실감이 드리웠습니다.';if(character.age<7)return'가족의 품에서 세상을 바라봅니다.';if(character.age>=60)return'긴 세월의 흔적이 얼굴에 남았습니다.';return'오늘도 새로운 하루를 살아가고 있습니다.'}
function isNegativeFeed(entry){if(entry.resultTone)return entry.resultTone==='negative';return/(부족|빚|잃(?:었|는|게|고)|실패|부상|사망|세상을 떠|죽음|병환|저주|패배|추방|거절|쇠약|위험|불행|상실|피해|도난|낙방|좌절|빈곤|가난|무너|파괴|위태|실수|과로|통증|고통)/.test(String(entry.text||''))}
function feedMarkup(character){return(character.feed||[]).slice(0,16).map(entry=>{const negative=isNegativeFeed(entry),tone=entry.resultTone?'result-tone-'+entry.resultTone:'',classes=['feed-entry',entry.type==='event'?'event-entry':'',entry.type==='economy'?'economy':'',entry.type==='disease'?'disease':'',entry.type==='death'?'death':'',entry.type==='warning'?'warning':'',tone,negative?'feed-tone-negative':''].filter(Boolean).join(' ');return'<article class="'+classes+'"><time>'+entry.age+'세 · '+String(Math.floor((entry.dayCount||0)%365)+1).padStart(3,'0')+'일'+(entry.resultTone?' · '+escapeXml(resultToneLabel(entry.resultTone)):'')+'</time>'+escapeXml(entry.text)+'</article>'}).join('')||'<div class="muted">시간이 흐르면 일상의 소식과 선택의 기록이 이곳에 쌓입니다.</div>'}
function statTile(key,character){const value=clampStat(Number(character?.[key])||0),label=STAT_LABELS[key]||key;return`<div class="stat-tile"><div class="stat-row"><span>${escapeXml(label)}</span><b>${value}</b></div><div class="bar"><i style="width:${value}%"></i></div></div>`}
function statPanel(character){return`<section class="box"><div class="box-inner"><h2 class="box-title">상태 능력치 · 12항목</h2><div class="stat-grid">${STAT_KEYS.map(key=>statTile(key,character)).join('')}</div><div class="rule"></div><div class="muted">타고난 재능　검 ${character.talents[0]} · 마법 ${character.talents[1]} · 지략 ${character.talents[2]} · 언변 ${character.talents[3]} · 신앙 ${character.talents[4]}</div></div></section>`}
function parallelPanel(character){return`<section class="box"><div class="box-inner"><h2 class="box-title">같은 1초에 태어난 사람들</h2><p class="muted">${character.name}과 같은 순간, 다른 대륙에서도 네 삶이 시작됐습니다.</p><div class="parallel-list">${character.parallels.map(person=>`<div class="parallel-card"><b>${escapeXml(person.land.nation)} · ${escapeXml(person.name)}</b><small>${escapeXml(person.rank)} · ${escapeXml(person.blood)} · ${person.age}세</small>${escapeXml(person.alive?`${person.profession} — ${person.status}`:person.fate)}</div>`).join('')}</div></div></section>`}
function historyMarkup(character){const records=(character.eventLog||[]).slice(0,12).map(entry=>'<div class="record-entry"><small>'+entry.age+'세 · '+escapeXml(entry.category)+' · '+escapeXml(entry.title)+'</small><b>'+escapeXml(entry.choice)+'</b><br>'+escapeXml(entry.result||'선택의 흔적이 연대기에 남았습니다.')+'</div>');const promises=(character.scheduled||[]).map(item=>{const event=EVENTS.find(entry=>entry.id===item.eventId);if(!event)return'';const years=Math.max(0,Math.ceil((Number(item.dueDayCount||0)-Number(character.dayCount||0))/365));return'<div class="record-entry scheduled-record"><small>돌아올 약속 · '+(years?years+'년 뒤':'곧')+'</small><b>'+escapeXml(event.title)+'</b><br>'+escapeXml(event.description)+'</div>'}).join('');return records.join('')+promises||(records.length?'':'<div class="record-entry">아직 기록된 사건이 없습니다.</div>')}
function lineageSigilMarkup(character){const blood=String(character?.blood||'인간'),index=/엘프/.test(blood)?1:/드워프/.test(blood)?2:/수인|야수/.test(blood)?3:/반신|신성|천족/.test(blood)?4:/용인|용족|드래곤/.test(blood)?5:/마족|악마/.test(blood)?6:/혼혈/.test(blood)?7:0,x=index%4*100/3,y=Math.floor(index/4)*100;return`<span class="sigil lineage-sigil" role="img" aria-label="${escapeXml(blood)} 혈통 문양" style="background-image:url('assets/lineage-atlas.png');background-size:400% 200%;background-position:${x}% ${y}%"></span>`}

const CATEGORY_SIGIL_DATA={가족:['가족','family','family'],성장:['성장','growth','growth'],정치:['정치','politics','politics'],전쟁:['전쟁','war','war'],사랑:['사랑','love','love'],모험:['모험','adventure','adventure'],초자연:['초자연','mystic','mystic'],어둠:['어둠','dark','dark'],죽음:['죽음','death','death'],치유:['치유','healing','healing'],종교:['종교','religion','religion'],학문:['학문','knowledge','knowledge'],생계:['생계','economy','economy'],출생:['출생','birth','birth'],무역:['무역','trade','economy'],미스터리:['미스터리','mystery','mystery']};

function birthArrivalView(){const c=state.life;if(!c)return landingView();const continentAsset=MAP_CONTINENT_ASSETS[c.land.continent]||'assets/maps/continent-arken.png',kingdomAsset='assets/maps/kingdom-'+(c.land.mapAsset||'arken-empire')+'.png',[focusX,focusY]=birthCoordinates(c);return`<section class="birth-arrival-page" style="--focus-x:${focusX}%;--focus-y:${focusY}%"><div class="arrival-heading"><div class="birth-eyebrow">THE WORLD RECEIVES A NEW LIFE</div><h1>별빛이 태어난 곳으로</h1><p>${escapeXml(c.name)}의 운명이 ${escapeXml(c.land.continent)}에서 ${escapeXml(c.land.nation)}으로 이어집니다.</p></div><div class="arrival-map-stack"><img class="arrival-world" src="assets/maps/world-map-v2.png" alt="아르케니아 세계 지도"><img class="arrival-continent" src="${continentAsset}" alt="${escapeXml(c.land.continent)} 지도"><img class="arrival-kingdom" src="${kingdomAsset}" alt="${escapeXml(c.land.nation)} 지도"><div class="arrival-crosshair" aria-hidden="true"><i></i><span>${escapeXml(c.land.continent)}</span></div><div class="arrival-location"><span>출생지</span><b>${escapeXml(c.land.place)}</b></div><button class="secondary arrival-skip" data-action="birth-arrival-skip">첫 사건으로 바로 가기</button></div><div class="arrival-caption"><span>아르케니아</span><i>›</i><span>${escapeXml(c.land.continent)}</span><i>›</i><span>${escapeXml(c.land.nation)}</span><i>›</i><b>${escapeXml(c.land.place)}</b></div></section>`}
function gameLayout(character){return`<div class="dashboard"><aside class="left-panel">${profilePanel(character)}${careerPanel(character)}${relationshipsPanel(character)}${statPanel(character)}</aside><main class="center-panel"><section class="event-stage" id="event-stage">${liveCard(character)}</section><section class="box feed-box"><div class="feed-head"><h3>실시간 생애 피드</h3><span class="muted">${character.age}세 · 선택의 기록</span></div><div class="feed-list" aria-live="polite">${feedMarkup(character)}</div></section></main>${rightPanel(character)}</div>`}
function landingView(){return`<div class="dashboard"><aside class="left-panel"><section class="box"><div class="box-inner"><div class="eyebrow">THE WORLD TREE</div><h2 class="box-title" style="margin-top:9px">균열의 시대</h2><p class="lore-note">태초의 빛과 어둠이 다섯 대륙을 빚었습니다. 신들은 직접 개입하지 않겠다고 맹세하고, 검과 마법을 인간에게 남겼습니다.</p><div class="map-wrap">${worldMapMarkup(null)}</div><div class="profile-tags"><span class="tag">5개 대륙</span><span class="tag">13개 국가</span></div></div></section></aside><main class="center-panel"><section class="event-stage"><section class="intro-card"><div class="eyebrow">A LIFE WRITTEN BY FATE</div><h1>아르케니아 연대기</h1><p>태어남은 우연으로, 살아감은 선택으로.<br>가문·신분·혈통이 무작위로 정해진 아이가 되어<br>죽음까지 한 생을 살아갑니다.</p><p>시간이 흐르면 세계의 소식이 실시간 피드에 지나갑니다.<br>선택이 필요한 순간에는 시간이 멈추고 룬 카드가 펼쳐집니다.</p><button class="primary" data-action="life-new">✦ 운명의 아이로 태어나기</button><div class="modal-actions"><button class="secondary" data-action="memorial-open">추모관 · ${state.memorial.length}개의 생</button></div></section></section><section class="box feed-box"><div class="feed-head"><h3>아르케니아 연대기</h3><span class="muted">제국력 300년</span></div><div class="feed-list"><article class="feed-entry">신들은 서약을 지키며 지켜보기만 합니다. 당신의 선택이 생의 다음 장을 엽니다.</article></div></section></main><aside class="right-panel"><div class="right-stack"><section class="box"><div class="box-inner"><h2 class="box-title">삶의 기록</h2><p class="lore-note">무작위 출생 · 나이별 사건 · 국가와 신분에 따른 분기 · 여러 갈래의 생애 결말</p><button class="mini-btn" style="margin-top:10px;width:100%" data-action="memorial-open">추모관 열기</button></div></section><section class="box"><div class="box-inner"><h2 class="box-title">세계의 균열</h2><p class="lore-note">별이 떨어지는 밤, 검과 마법을 함께 지닌 자가 세계의 균형을 다시 세우리라.</p><p class="lore-note">당신의 탄생과 같은 1초에 다른 네 대륙에서도 새로운 생이 시작됩니다.</p></div></section></div></aside></div>`}
function deathView(character){const ending=endingFor(character),cause=DEATH_CAUSES[character.deathCauseId]||DEATH_CAUSES.unknown;return`<div class="dashboard"><aside class="left-panel">${profilePanel(character)}</aside><main class="center-panel"><section class="event-stage"><article class="rune-card death-card">${eventArtMarkup(EVENTS.find(event=>event.id==='last-breath'),character,'death')}<div class="rune-content" style="text-align:center"><div class="rune-kicker">THE LAST PAGE · ${character.age} YEARS</div><h2 class="ending-title">${escapeXml(character.ending||ending.label)}</h2><p class="rune-copy">${escapeXml(ending.text)}</p><p class="muted">${escapeXml(character.name)} · ${escapeXml(character.land.nation)} · ${character.age}세<br>사망 원인 · ${escapeXml(cause.label)}<br>${escapeXml(character.deathCause)}</p><div class="modal-actions"><button class="primary" data-action="share-card-download">공유 카드 저장</button><button class="secondary" data-action="record-download">생애 기록 저장</button><button class="secondary" data-action="life-new">새 생 시작</button></div></div></article></section><section class="box feed-box"><div class="feed-head"><h3>마지막 생애 기록</h3><button class="mini-btn" data-action="memorial-open">추모관 열기</button></div><div class="feed-list">${feedMarkup(character)}</div></section></main>${rightPanel(character)}</div>`}
function memorialView(){const records=state.memorial;return`<div class="dashboard"><aside class="left-panel"><section class="box"><div class="box-inner"><div class="eyebrow">ARCHENIA REMEMBERS</div><h2 class="box-title" style="margin-top:8px">추모관</h2><p class="lore-note">당신이 살아낸 생과 선택은 이곳에 남습니다.</p><button class="mini-btn" style="width:100%;margin-top:12px" data-action="memorial-close">이전 화면으로</button></div></section></aside><main class="center-panel"><section class="event-stage"><section class="archive-screen"><div class="eyebrow">THE HALL OF REMEMBRANCE</div><h2>기록된 생애 · ${records.length}</h2>${records.length?`<div class="archive-list">${records.map(record=>`<article class="archive-card"><div><b>${escapeXml(record.name)}</b><br><span>${record.age}세 · ${escapeXml(record.nation)} · ${escapeXml(record.rank)}</span><br><span>${record.recordType==='rebirth'?'재탄생 기록':'명예 '+record.honor+' · 사망 원인 · '+(record.deathCauseLabel||deathCauseLabel(record.deathCauseId))}</span><br><small>${escapeXml(record.deathCause||'')}</small></div><div style="color:#d7bd78;font-size:11px;text-align:right">${escapeXml(record.ending)}</div></article>`).join('')}</div>`:'<p class="muted">아직 추모관에 기록된 생애가 없습니다. 한 생을 마치면 이름과 결말이 이곳에 새겨집니다.</p>'}<button class="primary" data-action="memorial-close">돌아가기</button></section></section></main><aside class="right-panel"><div class="right-stack"><section class="box"><div class="box-inner"><h2 class="box-title">추모 기록 안내</h2><p class="lore-note">기록 항목: 이름 · 나이 · 국가 · 신분 · 사망 원인 · 생애 결말</p><p class="lore-note">기록은 이 브라우저의 localStorage에 보관됩니다.</p></div></section>${state.life?`<section class="box"><div class="box-inner"><h2 class="box-title">현재 생애</h2><p class="lore-note">${escapeXml(state.life.name)} · ${state.life.age}세 · ${escapeXml(state.life.land.nation)}</p></div></section>`:''}</div></aside></div>`}
function renderLanding(){return landingView()}
function renderBirth(){return state.screen==='birth-roll'?birthRollView():birthArrivalView()}
function renderDeath(){return deathView(state.life)}
function renderMemorial(){return memorialView()}
function renderEvent(){return gameLayout(state.life)}
function renderGame(){return gameLayout(state.life)}
function storageRecoveryMarkup(){const rawAvailable=typeof state.storageRecovery?.rawSnapshot==='string';return'<section class="intro-card storage-recovery-card"><div class="eyebrow">ARCHENIA · SAVE RECOVERY</div><h1>저장된 연대기를 확인할 수 없습니다</h1><p>기존 저장을 그대로 보존했습니다. 원본을 내려받거나, 저장을 초기화하고 새 생을 시작할 수 있습니다.</p><p class="muted">'+escapeXml(state.storageRecovery?.message||'저장 데이터를 읽을 수 없습니다.')+'</p><div class="modal-actions">'+(rawAvailable?'<button class="secondary" data-action="recovery-export">원본 저장 내려받기</button>':'')+'<button class="primary" data-action="recovery-reset">저장 초기화 후 새 생 시작</button></div></section>'}
function screenMarkup(){if(state.storageRecovery)return storageRecoveryMarkup();if(state.screen==='memorial')return renderMemorial();if(state.screen==='birth-roll'||state.screen==='birth-arrival')return renderBirth();if(!state.life||state.screen==='home')return renderLanding();if(state.screen==='death')return renderDeath();if(state.screen==='event')return renderEvent();return renderGame()}
function render(){const root=document.getElementById('game');if(!root)return;const date=document.getElementById('date-pill'),live=document.getElementById('live-pill'),sound=document.getElementById('sound-button'),speedControl=document.getElementById('speed-control');if(sound)sound.textContent=state.soundOn?'사운드 켜짐':'사운드 꺼짐';if(speedControl)speedControl.innerHTML=speedControlsMarkup();if(date)date.textContent=state.life?dayLabel(state.life):'제국력 300년 · 봄 · 001일';if(live){if(!['home','birth','birth-roll','birth-arrival','running','event','result','death','memorial'].includes(state.screen))state.screen=state.life?(state.life.alive===false?'death':'running'):'home';if(!state.life&&!['memorial'].includes(state.screen))state.screen='home';live.textContent=state.screen==='running'||state.screen==='event'||state.screen==='result'?(state.screen==='event'?'선택 대기':state.screen==='result'?'결과의 여운':state.life?.paused?'일시정지':'LIFE IN MOTION'):state.screen==='birth-roll'?'운명을 읽는 중':state.screen==='birth-arrival'?'탄생의 땅으로':state.screen==='death'?'생애 기록':state.screen==='memorial'?'추모관':'균열의 시대';live.classList.toggle('paused',state.screen==='event'||state.screen==='result'||!!state.life?.paused)}try{syncMusic()}catch(error){console.warn('배경 음악 초기화 오류:',error)}const eventKey=state.screen==='event'?(state.life?.pendingEventId||''):'';const animateEvent=!!eventKey&&eventKey!==lastRenderedEventKey;try{root.innerHTML=screenMarkup()+(restartConfirmOpen?restartConfirmationMarkup():'');root.querySelectorAll('.event-art-image').forEach(image=>image.addEventListener('error',()=>{image.hidden=true;const placeholder=image.parentElement?.querySelector('.event-art-placeholder');if(placeholder)placeholder.style.display='grid'},{once:true}));if(state.screen==='birth-arrival')startArrivalZoom();if(state.screen==='result')startChoiceReveal();if(animateEvent)root.querySelector('.rune-card')?.classList.add('is-event-arrival');lastRenderedEventKey=eventKey}catch(error){console.error('화면 렌더링 오류:',error);const diagnostic=String(error?.stack||error?.message||error||'알 수 없는 오류'),context='화면: '+String(state.screen||'알 수 없음')+' · 생애 데이터: '+(state.life?'있음':'없음');root.innerHTML='<section class="intro-card"><div class="eyebrow">ARCHENIA · RECOVERY</div><h1>연대기를 다시 펼칩니다</h1><p>화면을 구성하는 중 문제가 발생했습니다. 저장된 생애는 유지됩니다.</p><details class="recovery-diagnostic"><summary>오류 내용 보기</summary><p>'+escapeXml(context)+'</p><pre>'+escapeXml(diagnostic)+'</pre></details><button class="primary" data-action="page-reload">다시 불러오기</button></section>'}}
function endScreenBack(){closeMemorial()}
function downloadRecord(){const character=state.life;if(!character){showToast('저장할 생애 기록이 없습니다.');return}const ending=character.ending||endingFor(character).label;const lines=[`아르케니아 연대기 — ${character.name}`,`${character.age}세 · ${character.land.nation} · ${character.rank}`,`명예 ${character.honor} · 결말 ${ending}`,`사망 원인: ${deathCauseLabel(character.deathCauseId)} · ${character.deathCause||'생애 진행 중'} (ID: ${character.deathCauseId||'unknown'})`,'','생애 기록',...(character.eventLog||[]).slice().reverse().map(entry=>`${entry.age}세 [${entry.category}] ${entry.title} — ${entry.choice}`)];downloadBlob(new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}),`${character.name}-생애기록.txt`)}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob);const anchor=document.createElement('a');anchor.href=url;anchor.download=name;anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function downloadShareCard(){const character=state.life;if(!character){showToast('공유할 생애가 없습니다.');return}const canvas=document.createElement('canvas');canvas.width=1200;canvas.height=675;const context=canvas.getContext('2d');if(!context){showToast('이 브라우저에서는 공유 카드를 만들 수 없습니다.');return}const gradient=context.createLinearGradient(0,0,1200,675);gradient.addColorStop(0,'#111c28');gradient.addColorStop(.55,'#172f3d');gradient.addColorStop(1,'#0a121e');context.fillStyle=gradient;context.fillRect(0,0,1200,675);context.strokeStyle='#b59a64';context.lineWidth=2;context.strokeRect(18,18,1164,639);context.fillStyle='#dec48b';context.font='600 24px Segoe UI';context.fillText('CHRONICLES OF ARCHENIA',70,82);context.fillStyle='#f4efe1';context.font='bold 48px Segoe UI';context.fillText(character.name,70,174);context.fillStyle='#c8d4d8';context.font='25px Segoe UI';context.fillText(character.land.nation+' · '+character.rank+' · '+character.age+'세',70,225);context.fillStyle='#e0c47b';context.font='bold 34px Segoe UI';context.fillText(character.ending||endingFor(character).label,70,330);context.fillStyle='#c8d4d8';context.font='22px Segoe UI';context.fillText('명예 '+character.honor+' · 검술 '+character.sword+' · 마법 '+character.magic+' · 신앙 '+character.faith,70,390);context.fillStyle='#d6b97a';context.font='bold 21px Segoe UI';context.fillText('사망 원인 · '+deathCauseLabel(character.deathCauseId),70,470);context.fillStyle='#93a7ad';context.font='18px Segoe UI';context.fillText('당신의 선택이 한 생의 연대기가 되었습니다.',70,570);const asset=portraitAsset(character),portrait=new Image();portrait.onload=()=>{context.save();context.beginPath();context.roundRect(850,110,260,360,12);context.clip();context.drawImage(portrait,850,110,260,360);context.restore();canvas.toBlob(blob=>{if(blob)downloadBlob(blob,character.name+'-연대기카드.png');else showToast('공유 카드를 저장하지 못했습니다.')})};portrait.onerror=()=>showToast('초상화 파일을 불러오지 못했습니다.');portrait.src=asset.src}
function startLifeClock(){if(state.screen==='running')startClock()}
document.addEventListener('visibilitychange',()=>{const reveal=state.life?.resultReveal;if(document.hidden){if(state.screen==='result'&&reveal&&!reveal.pausedAt){reveal.pausedAt=Date.now();if(resultRevealTimer){clearTimeout(resultRevealTimer);resultRevealTimer=null}}saveState();return}if(state.screen==='result'&&reveal?.pausedAt&&!restartConfirmOpen){reveal.endsAt+=Date.now()-reveal.pausedAt;delete reveal.pausedAt;saveState();startChoiceReveal()}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.screen==='memorial')closeMemorial();else if(!restartConfirmOpen&&(event.key==='Enter'||event.key===' ')&&state.screen==='result'){event.preventDefault();finishChoiceReveal()}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&restartConfirmOpen)cancelRestartLife()});
document.addEventListener('click',event=>{if(restartConfirmOpen&&event.target.classList?.contains('chronicle-modal-backdrop')){cancelRestartLife();return}const choice=event.target.closest?.('[data-choice-index]');if(choice)chooseOption(Number(choice.dataset.choiceIndex));const control=event.target.closest?.('[data-action]');if(!control)return;if(state.storageRecovery&&!['recovery-export','recovery-reset'].includes(control.dataset.action))return;const action=control.dataset.action;switch(action){case'recovery-export':if(typeof state.storageRecovery?.rawSnapshot==='string')downloadBlob(new Blob([state.storageRecovery.rawSnapshot],{type:'application/json;charset=utf-8'}),'archenia-save-recovery.json');break;case'recovery-reset':state.storageRecovery=null;state.life=null;state.memorial=[];startNewLife();break;case'restart-life':restartLife();break;case'restart-confirm':confirmRestartLife();break;case'restart-cancel':cancelRestartLife();break;case'memorial-open':openMemorial();break;case'memorial-close':closeMemorial();break;case'sound-toggle':toggleSound();break;case'speed-set':setSpeed(control.dataset.speed);break;case'map-view':{const level=['continent','kingdom','location','detail'].includes(control.dataset.level)?control.dataset.level:'continent';setMapView(level,control.dataset.continent||'',control.dataset.nation||'',control.dataset.location||'');break}case'pause-toggle':togglePause();break;case'record-download':downloadRecord();break;case'life-begin':beginLife();break;case'life-new':startNewLife();break;case'birth-reroll':rollAnotherBirth();break;case'birth-confirm':confirmBirth();break;case'birth-roll-skip':revealBirthRoll();break;case'birth-arrival-skip':beginLife();break;case'share-card-download':downloadShareCard();break;case'page-reload':location.reload();break}});
if(!state.storageRecovery&&!state.life&&state.screen==='home'){state.life=createLife();state.life.birthRollRevealAt=Date.now()+BIRTH_ROLL_DURATION;state.screen='birth-roll';saveState()}
if(state.life){normalizeLifeData(state.life);if(!state.life.relationships.length)state.life.relationships=createRelationships(state.life);if(!state.life.ambition)state.life.ambition=drawAmbition();if(!state.life.nextEventTick)state.life.nextEventTick=(state.life.ticks||0)+4;ensureEconomy(state.life);saveState();if(state.screen==='event'&&!state.life.pendingEventId)state.screen='running';if(state.screen==='result'&&!state.life.resultReveal)state.screen='running';if(state.screen==='running')startLifeClock()}
render();
if(state.soundOn){syncMusic();document.addEventListener('pointerdown',()=>{if(state.soundOn)syncMusic()},{once:true});document.addEventListener('keydown',()=>{if(state.soundOn)syncMusic()},{once:true})}
if(state.screen==='birth-roll')startBirthRoll();else if(state.screen==='birth-arrival')resumeBirthArrival();else if(state.screen==='result')startChoiceReveal();
</script>
</body>
</html>
